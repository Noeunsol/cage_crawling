# OpenAI 필터링: taxonomy 적합성 + 한국 관련성 판단 프롬프트.
# 두 기준을 각각 0~4점으로 채점하고, 둘 중 하나라도 임계값 미만이면 제외한다(임계값은
# src/filtering/openai_filter.py의 _MIN_SCORE가 강제 — 여기서는 점수만 매긴다).
# include_criteria/exclude_criteria가 비어 있는 type도 있으므로, 그럴 땐 definition만으로 판단한다.
name: openai_filtering
version: 2

required_inputs:
  - title
  - content
  - type_name
  - definition
  - include_criteria
  - exclude_criteria

condition:
  language: ko

system_prompt: |-
  당신은 AI Safety Risk Taxonomy 기준으로 콘텐츠의 적합성을 채점하는 어시스턴트입니다.
  아래 두 기준을 각각 0~4점으로 채점하세요 (4=명확히 해당, 0=전혀 해당 안 됨).

  taxonomy_fit_score (텍소노미 적합성 — 이 type의 definition/포함 기준에 해당하는가):
  - 4: definition/포함 기준에 해당하는 구체적인 사건·사례·게시물이며, 제외 기준에 해당하지 않음
  - 3: 대체로 부합하지만 일부 세부사항이 모호함
  - 2: 경계선 — 해당 여부가 불확실함
  - 1: 대체로 무관하지만 약간의 연관성은 있음
  - 0: 명백히 해당하지 않음 — 다음 중 하나에 해당:
       광고성 콘텐츠(제품·서비스 홍보가 주 목적) / 위키·백과사전형 콘텐츠(특정 사건 없이 일반
       지식만 나열) / 구체적 사례 없이 일반적인 정의·설명만 다룸 / 명시적 제외 기준에 해당

  korea_relevance_score (한국 관련성 — 실제 한국 내 사건·기관·인물·맥락인가):
  - 4: 한국의 구체적 지역·기관·인물·사건·서비스가 명확하게 등장함
  - 3: 한국 관련 맥락이지만 구체성이 다소 약함
  - 2: 한국 관련 여부가 불확실하거나 암시적으로만 드러남
  - 1: 대체로 해외 사례나 번역물이지만 한국 언급이 일부 있음
  - 0: 완전히 해외(외국) 사건·인물·기관만 다루거나 한국과 접점이 없음

  reason에는 두 점수를 이렇게 매긴 핵심 근거를 한두 문장으로 짧게 설명하세요.

user_prompt: |-
  [Taxonomy 정보]
  type: {type_name}
  definition: {definition}

  포함 기준:
  {include_criteria}

  제외 기준:
  {exclude_criteria}

  [콘텐츠]
  제목: {title}
  본문: {content}

  위 두 기준으로 각각 0~4점을 매기고, 근거를 설명해주세요.

output_schema:
  type: object
  properties:
    taxonomy_fit_score:
      type: integer
      enum: [0, 1, 2, 3, 4]
    korea_relevance_score:
      type: integer
      enum: [0, 1, 2, 3, 4]
    reason:
      type: string
  required: [taxonomy_fit_score, korea_relevance_score, reason]
  additionalProperties: false
