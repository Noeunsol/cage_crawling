# 트렌드 수집 모드 설정 (python -m src.main --mode trend).
# 이번 단계 대상: dcinside + 뉴스 RSS. fmkorea/natepann은 다음 단계(Playwright/API).
# ponytail: 갤러리 id·RSS url은 실제 접근 가능 여부를 확인 후 보정할 것(값은 초기 seed).

# 수집 대상 게시물의 생성 일자 범위 제한 
collection:
  lookback_days: 1
  max_lookback_days: 5

# 날짜 범위 수집이 폭주하지 않도록 두는 절대 안전 상한이다.
discovery_limits:
  max_pages_per_gallery: 20
  max_scan_candidates_by_source:
    dcinside: 5000
    news_rss: 2000

# 목록에서는 기간 전체의 제목·시각을 넓게 확인하고, 비싼 본문·LLM 대상만 날짜별 제한한다.
sampling:
  daily_quota_by_source:
    dcinside: 200
    news_rss: 100
  time_bucket_hours: 4
  engagement_ratio: 0.30
  absolute_max_selected: 1000

processing_limits:
  # 디시 200 + 뉴스 100의 날짜별 본문 표본을 모두 평가할 수 있는 안전 상한.
  max_llm_calls_per_day: 300

# 본문/댓글 속 링크도 1단계(depth 1) 추가 수집. 이미지/미디어·중복 제외, 상한 적용.
follow_body_links:
  enabled: true
  max_per_post: 3      # 원글 1개당 따라갈 링크 수
  max_total: 50        # run 전체 후속 링크 상한(폭주 방지)

# 주제형 버킷 비중 (meta.bucket 라벨과 일치해야 함). is_trending은 갤러리별 trending 플래그로 별도.
sampling_ratio:
  random_trend: 0.15            # 실베 등 화제성 전반(교차 라벨)
  gender_conflict: 0.20         # 성별 혐오·조롱·집단 비하
  issue_or_politics: 0.20       # 정치·사회 갈등·지역 비하
  entertainment_or_person: 0.25 # 연예/인물 악플·루머·신상
  toxic_game: 0.10              # 게임 독성 발화·사적 제재
  it_game_security: 0.10        # 보안·코드·내부정보

sources:
  dcinside:
    enabled: true
    max_pages: 2               # 갤러리당 목록 페이지 수
    max_comments_per_post: 30  # 글당 댓글 수 제한
    # id·성격은 2026-07-30 Fetcher로 200/정적파싱 검증 완료. bucket=주제 태그(sampling_ratio와 일치).
    galleries:
      - {id: dcbest,           name: 실시간베스트,  bucket: random_trend, trending: true}
      - {id: neostock,         name: 주식,        bucket: gender_conflict}
      - {id: baseball_new11,   name: 국내야구,     bucket: issue_or_politics}
      - {id: drama_new3,       name: 국내드라마,    bucket: entertainment_or_person}
      - {id: w_entertainer,    name: 여자연예인,    bucket: entertainment_or_person}
      - {id: ib_new2,          name: 인터넷방송,    bucket: entertainment_or_person, sort: comments}
      - {id: leagueoflegends6, name: 리그오브레전드, bucket: toxic_game}
      - {id: programming,      name: 프로그래밍,    bucket: it_game_security}

  news_rss:
    enabled: true
    category_sampling:
      사건·사고: 0.35
      사회: 0.30
      연예: 0.20
      IT·보안: 0.10
      정치: 0.05
    feeds:
      - {press: 연합뉴스, category: 사회, url: "https://www.yna.co.kr/rss/society.xml"}
      - {press: 뉴시스, category: 사건·사고, url: "https://www.newsis.com/RSS/sokbo.xml"}
      - {press: 뉴시스, category: 사회, url: "https://www.newsis.com/RSS/society.xml"}
      - {press: 뉴시스, category: 연예, url: "https://www.newsis.com/RSS/entertain.xml"}
      - {press: 연합뉴스, category: 정치, url: "https://www.yna.co.kr/rss/politics.xml"}
      - {press: 뉴시스, category: IT·보안, url: "https://www.newsis.com/RSS/health.xml"}
      # KISA는 공지/안내 비중이 높아 저우선 보조 소스로 둔다.
      - {press: KISA, category: IT·보안, url: "https://kisa.or.kr/rss/402"}
