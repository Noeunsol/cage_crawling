- lv1_name: Misinformation Harms
  lv2_id: 3_G_Misinformation_and_Disinformation
  lv2_name: Misinformation_and_Disinformation
  lv2_definition: 공중 보건, 과학적 사실을 왜곡하거나 정치/선거에 개입하기 위한 가짜 뉴스, 조작된 딥페이크 스크립트, 여론 조작용 텍스트를 생성하는 행위
  lv2_description: 가짜 뉴스, 선전, 명예훼손, 선거 관련 허위 사실 등 악의적으로 조작된 정보
  types:
  - name: false_news
    definition: 사실이 아닌 내용을 실제 뉴스나 검증된 정보처럼 작성·유포하는 행위
    description: 사실이 아닌 내용을 실제 뉴스나 검증된 정보처럼 작성·유포하는 행위
    include_criteria:
    - 실제로 유포된 특정 가짜뉴스·허위정보 사례와 그 내용, 유포 경위
    - 언론·팩트체크 기관이 특정 허위정보를 검증하고 반박한 사례
    exclude_criteria:
    - 가짜뉴스의 위험성을 다루는 일반 계도성 칼럼이나 미디어 리터러시 교육 콘텐츠
    - 허위정보 탐지 기술·서비스 홍보
    enabled: true
    tavily:
      topic: news
  - name: misinterpretation_or_wrong_context
    definition: 사실 일부를 왜곡하거나 원래 맥락에서 분리해 잘못된 의미로 해석·전달하는 행위
    description: 사실 일부를 왜곡하거나 원래 맥락에서 분리해 잘못된 의미로 해석·전달하는 행위
    include_criteria:
    - 원래 맥락에서 잘려나가거나 왜곡되어 다른 의미로 퍼진 실제 사례 (발언, 통계, 이미지 등)
    - 팩트체크 기관이 맥락 오류를 지적하고 바로잡은 사례
    exclude_criteria:
    - 맥락 왜곡과 무관한 일반 뉴스 해설이나 의견 기사
    - 미디어 리터러시 교육 자료
    enabled: true
    tavily:
      topic: general
  - name: propaganda
    definition: 정치적·이념적 목적을 위해 편향되거나 조작된 메시지를 반복적으로 생산하여 여론을 유도하는 행위
    description: 정치적·이념적 목적을 위해 편향되거나 조작된 메시지를 반복적으로 생산하여 여론을 유도하는 행위
    include_criteria:
    - 특정 정치·이념적 목적을 위해 조작되거나 편향된 메시지가 조직적으로 유포된 실제 사례
    - 여론조작 정황이 드러나 조사·보도된 사건 (댓글부대, 봇 활동 등)
    exclude_criteria:
    - 정당·정책에 대한 정상적인 비평이나 논평 기사
    - 프로파간다 개념을 설명하는 일반 학술·교육 콘텐츠
    enabled: true
    tavily:
      topic: news
  - name: rumors
    definition: 확인되지 않은 주장이나 소문을 사실처럼 생성·확산하여 혼란이나 평판 피해를 유발하는 행위
    description: 확인되지 않은 주장이나 소문을 사실처럼 생성·확산하여 혼란이나 평판 피해를 유발하는 행위
    search_vocabulary:
    - 괴담
    - 유언비어
    - 찌라시
    - 사실무근
    - 사칭
    - 허위 주장
    - 팩트체크
    - 거짓 소문
    - 루머 해명
    - 진위 확인
    include_criteria:
    - 확인되지 않은 소문이 실제로 확산되어 논란이나 피해를 일으킨 구체적 사례
    - 소문의 진위를 확인·반박한 보도나 게시물
    exclude_criteria:
    - 이미 사실로 확인된 뉴스나 공식 발표
    - 유언비어와 무관한 일반 커뮤니티 잡담
    enabled: true
    tavily:
      topic: general
- lv1_name: Misinformation Harms
  lv2_id: 3_H_Prohibited_Advisory
  lv2_name: Prohibited_Advisory
  lv2_definition: 의료, 법률, 금융 등 비전문가 AI가 면책 조항 없이 단정적이고 행동 가능한 전문 지침을 제공하여 신체적/재산적 피해를 유발하는 행위
  lv2_description: 자격을 갖춘 전문가만이 제공해야 하는 의료, 법률, 금융 관련 전문 조언
  types:
  - name: financial_advice
    definition: 투자, 대출, 보험, 세금 등 금융 의사결정에 대해 위험성과 한계를 설명하지 않고 단정적이며 행동 가능한 지침을 제공하는 행위
    description: 투자, 대출, 보험, 세금 등 금융 의사결정에 대해 위험성과 한계를 설명하지 않고 단정적이며 행동 가능한 지침을 제공하는 행위
    include_criteria:
    - 위험성 설명 없이 투자·대출·보험·세금 등에 대해 단정적으로 행동을 지시하는 실제 조언·게시물이나 상담 사례
    - 무자격 금융 조언으로 인한 피해나 분쟁 사례
    exclude_criteria:
    - 금융감독기관이나 전문가가 위험고지를 포함해 제공하는 정상적인 금융 정보
    - 단정적 지침이 아닌 일반 금융상품 설명
    enabled: true
    tavily:
      topic: general
  - name: legal_advice
    definition: 법률 자격이나 충분한 사실관계 검토 없이 소송, 처벌 회피, 계약, 권리 행사 등에 대해 단정적인 전문 지침을 제공하는 행위
    description: 법률 자격이나 충분한 사실관계 검토 없이 소송, 처벌 회피, 계약, 권리 행사 등에 대해 단정적인 전문 지침을 제공하는 행위
    include_criteria:
    - 법률 자격 없이 소송·처벌회피·계약 등에 대해 단정적인 지침을 제공하는 실제 사례
    - 무자격 법률 조언으로 인한 피해나 분쟁 사례
    exclude_criteria:
    - 변호사 등 자격을 갖춘 전문가의 정상적인 법률 상담(위험고지 포함)
    - 법률 제도를 설명하는 일반 정보
    enabled: true
    tavily:
      topic: general
  - name: medical_advice
    definition: 의료 전문가의 진단 없이 질병, 약물, 치료, 처방 등에 대해 단정적이고 실행 가능한 전문 지침을 제공하는 행위
    description: 의료 전문가의 진단 없이 질병, 약물, 치료, 처방 등에 대해 단정적이고 실행 가능한 전문 지침을 제공하는 행위
    include_criteria:
    - 진단 없이 질병·약물·치료·처방에 대해 단정적으로 지침을 제공하는 실제 사례
    - 무자격 의료 조언으로 인한 피해나 분쟁 사례
    exclude_criteria:
    - 의료진이 제공하는 정상적인 건강 정보나 공식 의료기관 안내
    - 단정적 처방이 아닌 일반 건강 상식 콘텐츠
    enabled: true
    tavily:
      topic: general
- lv1_name: Information and Safety Harms
  lv2_id: 4_I_Privacy_Infringement
  lv2_name: Privacy_Infringement
  lv2_definition: 식별 가능한 개인정보(PII) 무단 노출 및 온라인 데이터를 조합하여 특정인의 위치를 추적하거나 민감한 특성(성적 지향, 질병 등)을 추론해 내는 행위
  lv2_description: 식별 가능한 개인정보(PII), 사생활, 금융/의료 정보 등의 무단 노출 및 유출
  types:
  - name: privacy_violation
    definition: 개인정보, 연락처, 주소, 위치, 금융·의료 정보, 사적 메시지 등을 동의 없이 수집·결합·추론·노출하는 행위
    description: 개인정보, 연락처, 주소, 위치, 금융·의료 정보, 사적 메시지 등을 동의 없이 수집·결합·추론·노출하는 행위
    include_criteria:
    - 개인정보·연락처·위치·금융의료정보 등이 동의 없이 노출·유출·추적된 실제 사건이나 상담 사례
    - 개인정보 침해로 인한 신고, 소송, 처벌 관련 사례
    exclude_criteria:
    - 개인정보보호 제도·서비스(마이데이터 등) 자체에 대한 일반적인 설명이나 이용 안내
    - 개인정보보호 솔루션·서비스 홍보
    enabled: true
    tavily:
      topic: news
- lv1_name: Information and Safety Harms
  lv2_id: 4_J_Public_Sensitive_Info_Leakage
  lv2_name: Public_Sensitive_Info_Leakage
  lv2_definition: 공개되지 않은 기업 영업 비밀, 내부 소스 코드, 클라우드 아키텍처 정보, 보안 자격 증명, 정부 기밀 등을 무단으로 노출하거나 유도하는 행위
  lv2_description: 기업 영업 비밀, 보안 취약점, 내부 정책 등 공개되지 않아야 할 민감 정보 유출
  types:
  - name: confidential_operations
    definition: 기업·기관의 비공개 업무 절차, 운영 방식, 사고 대응 체계, 공급망 등의 기밀 운영 정보를 노출하는 행위
    description: 기업·기관의 비공개 업무 절차, 운영 방식, 사고 대응 체계, 공급망 등의 기밀 운영 정보를 노출하는 행위
    include_criteria:
    - 실제 기업·기관에서 기밀 문서, 내부 자료, 소스코드, 공급망 정보가 유출·노출된 구체적 사건
    - 사고 대응 체계, 내부 운영 절차, 계약·공급망 정보가 외부에 노출된 보도나 신고 사례
    - 기밀 유출로 인한 피해 확인, 당국 신고, 조사 결과 등 사건 경과를 다루는 내용
    exclude_criteria:
    - 보안 솔루션·제품 소개, 기업 홍보, 컨설팅·자문 서비스 광고
    - 특정 사건 없이 개념·정책·거버넌스·모범사례(best practice)를 설명하는 일반론 가이드
    - 통계 요약이나 트렌드 리포트처럼 개별 사건이 아닌 산업 동향을 다루는 글
    - 유출 대상이 고객 개인정보인 사건 (개인정보 유출은 privacy_violation에서 다룸)
    enabled: true
    tavily:
      topic: news
  - name: cybersecurity_vulnerabilities
    definition: 공개되지 않았거나 악용 위험이 큰 시스템 취약점, 인증 정보, 보안 설정 등을 무단으로 노출하는 행위
    description: 공개되지 않았거나 악용 위험이 큰 시스템 취약점, 인증 정보, 보안 설정 등을 무단으로 노출하는 행위
    include_criteria:
    - 실제 소프트웨어·시스템의 구체적 취약점(CVE 등)이 발견·공개되거나 악용된 사건
    - 인증 정보(계정, 비밀번호, API 키 등)나 보안 설정이 실수로 노출된 사례
    - 취약점을 악용한 실제 공격·침해 사고 보도
    exclude_criteria:
    - 보안 솔루션·제품 홍보, 컨설팅 서비스 광고
    - 특정 취약점 없이 보안 트렌드·통계·정책을 다루는 일반 리포트
    - 취약점 관리 체계나 거버넌스에 대한 개념적 설명
    enabled: true
    tavily:
      topic: general
  - name: financial_and_budgetary_information
    definition: 기업·기관의 비공개 예산, 비용 구조, 재무 계획, 자금 흐름 등의 민감한 재무 정보를 노출하는 행위
    description: 기업·기관의 비공개 예산, 비용 구조, 재무 계획, 자금 흐름 등의 민감한 재무 정보를 노출하는 행위
    include_criteria:
    - 기업·기관의 비공개 예산안, 원가 구조, 자금 흐름, 투자·계약 금액 등이 외부에 노출된 구체적 사건
    - 내부 재무 문서나 회계 자료가 유출·공개된 사례
    exclude_criteria:
    - 이미 공시·발표된 실적, 주가, 매출 등 공개된 재무 정보를 다루는 일반 기사
    - 다른 유형의 유출 사고(개인정보 유출 등)로 인한 과징금·영업정지·주가 하락 등 재무적 여파만 다루는 기사
    - 재무·회계 관련 일반 지식, 세무 상담, 컨설팅 광고
    enabled: true
    tavily:
      topic: news
  - name: internal_communications
    definition: 내부 이메일, 회의록, 메신저, 보고 내용 등 외부 공개가 허용되지 않은 의사소통 내용을 유출하는 행위
    description: 내부 이메일, 회의록, 메신저, 보고 내용 등 외부 공개가 허용되지 않은 의사소통 내용을 유출하는 행위
    include_criteria:
    - 사내 이메일·메신저·회의록·보고서 등 내부 커뮤니케이션 내용이 실제로 외부에 유출된 사건
    - 유출된 내부 소통 내용으로 인한 논란이나 법적 분쟁 사례
    exclude_criteria:
    - 직장 내 괴롭힘·갈등 상담이나 조직문화 일반론 (내부 문서 유출 사건이 아닌 경우)
    - 커뮤니케이션 도구·협업 솔루션 홍보
    enabled: true
    tavily:
      topic: news
  - name: internal_policies_and_classified_documents
    definition: 비공개 내부 규정, 보안 문서, 정부·기관의 기밀 문서 또는 분류 정보를 노출하는 행위
    description: 비공개 내부 규정, 보안 문서, 정부·기관의 기밀 문서 또는 분류 정보를 노출하는 행위
    include_criteria:
    - 기업 내부 규정, 정부·기관의 기밀·분류 문서가 실제로 유출되거나 무단 공개된 사건
    - 기밀 문서 유출로 인한 조사, 징계, 법적 조치 사례
    exclude_criteria:
    - 이미 공개된 법령·제도·가이드라인을 해설하는 일반 기사
    - 내부 규정 위반이 아닌 일반적인 조직 운영·정책 소개
    enabled: true
    tavily:
      topic: news
  - name: legal_information
    definition: 미공개 소송 전략, 법무 검토 의견, 조사 자료, 합의 조건 등 법적 민감 정보를 유출하는 행위
    description: 미공개 소송 전략, 법무 검토 의견, 조사 자료, 합의 조건 등 법적 민감 정보를 유출하는 행위
    include_criteria:
    - 미공개 소송 전략, 법무 검토 의견서, 내부 조사 자료, 합의 조건 등이 유출된 구체적 사건
    - 법적 분쟁 관련 기밀 정보 유출로 인한 논란이나 후속 조치 사례
    exclude_criteria:
    - 이미 선고된 판결 내용이나 공개된 법률 상담 Q&A 등 법률 지식 소개 글
    - 법무법인·변호사 서비스 홍보
    enabled: true
    tavily:
      topic: general
  - name: sensitive_technological_details
    definition: 내부 소스 코드, 시스템 아키텍처, 알고리즘, 제조 공정 등 공개되지 않은 핵심 기술 정보를 노출하는 행위
    description: 내부 소스 코드, 시스템 아키텍처, 알고리즘, 제조 공정 등 공개되지 않은 핵심 기술 정보를 노출하는 행위
    include_criteria:
    - 소스코드, 시스템 아키텍처, 알고리즘, 제조 공정 등 비공개 핵심 기술 정보가 실제로 유출된 사건
    - 기술 유출로 인한 산업스파이·특허분쟁·법적 조치 사례
    exclude_criteria:
    - 기술 트렌드·아키텍처 설계에 대한 일반적인 개발자 지식 공유(Q&A, 튜토리얼)
    - 특허·기술 컨설팅 서비스 홍보
    enabled: true
    tavily:
      topic: general
- lv1_name: Information and Safety Harms
  lv2_id: 4_K_Intellectual_Property_Infringement
  lv2_name: Intellectual_Property_Infringement
  lv2_definition: 타인의 상용 저작물(도서, 기사, 유료 콘텐츠 등), 상표, 특허받은 소프트웨어 코드를 적절한 인용이나 라이선스 없이 원문 그대로 출력하거나, 이를 우회하여
    표절할 수 있도록 돕는 행위
  lv2_description: 타인의 저작권, 상표권 등 지식재산권을 침해하는 결과물 생성
  types:
  - name: copyright_piracy
    definition: 도서, 기사, 영상, 음악, 유료 강의 등 저작물을 허가 없이 원문 그대로 복제·공유하거나 불법 이용을 돕는 행위
    description: 도서, 기사, 영상, 음악, 유료 강의 등 저작물을 허가 없이 원문 그대로 복제·공유하거나 불법 이용을 돕는 행위
    include_criteria:
    - 도서·기사·영상·음악·유료강의 등을 허가 없이 원문 그대로 복제·유포한 실제 사건이나 단속 사례
    - 저작권 침해 고소, 처벌, 손해배상 관련 사례
    exclude_criteria:
    - 저작권법이나 정당한 인용·공정이용을 설명하는 일반 법률 정보
    - 저작권 보호 서비스·기술을 소개하는 홍보성 글
    enabled: true
    tavily:
      topic: news
  - name: counterfeit_trademark
    definition: 타인의 상표, 브랜드, 로고를 모방해 정품처럼 보이게 하거나 위조 상품 제작·판매를 돕는 행위
    description: 타인의 상표, 브랜드, 로고를 모방해 정품처럼 보이게 하거나 위조 상품 제작·판매를 돕는 행위
    include_criteria:
    - 상표·브랜드·로고를 모방해 위조상품을 제작·판매한 실제 사건이나 단속 사례
    - 상표권 침해 고소, 처벌, 압수 관련 사례
    exclude_criteria:
    - 상표법이나 지식재산권 제도를 설명하는 일반 정보
    - 정품 인증 방법을 안내하는 일반 소비자 정보
    enabled: true
    tavily:
      topic: news
  - name: patent_infringement
    definition: 특허로 보호되는 기술이나 공정을 허가 없이 구현·복제하도록 구체적으로 지원하는 행위
    description: 특허로 보호되는 기술이나 공정을 허가 없이 구현·복제하도록 구체적으로 지원하는 행위
    include_criteria:
    - 특허받은 기술·공정을 허가 없이 구현·복제한 실제 사건이나 소송 사례
    - 특허침해 고소, 처벌, 손해배상 관련 사례
    exclude_criteria:
    - 특허 제도나 출원 절차를 설명하는 일반 정보
    - 특허 컨설팅 서비스 홍보
    enabled: true
    tavily:
      topic: news
  - name: trade_secret_theft
    definition: 기업의 영업 비밀, 비공개 기술, 고객 정보, 전략 자료 등을 절취·유출·악용하도록 돕는 행위
    description: 기업의 영업 비밀, 비공개 기술, 고객 정보, 전략 자료 등을 절취·유출·악용하도록 돕는 행위
    include_criteria:
    - 기업의 영업비밀·비공개기술·고객정보·전략자료를 절취·유출·악용한 실제 사건
    - 영업비밀 침해 고소, 처벌, 소송 관련 사례
    exclude_criteria:
    - 영업비밀보호법을 설명하는 일반 법률 정보
    - 기업 보안 컨설팅 서비스 홍보
    enabled: true
    tavily:
      topic: news
- lv1_name: Malicious Use
  lv2_id: 5_L_Illegal_Activity
  lv2_name: Illegal_Activity
  lv2_definition: 사기, 절도, 밀수 등 물리적 범죄 지침 제공 및 피싱 이메일 작성, 사회공학적 기만, 신분 위조 등 디지털 사기를 조력하는 행위
  lv2_description: 사기, 기만, 불법 서비스 악용 등 비폭력적 범죄 행위를 촉진하거나 돕는 결과물
  types:
  - name: facilitating_criminal_activities
    definition: 절도, 갈취, 밀수, 위조, 침입 등 범죄를 실행하거나 은폐하는 데 필요한 방법·절차·도구를 제공하는 행위
    description: 절도, 갈취, 밀수, 위조, 침입 등 범죄를 실행하거나 은폐하는 데 필요한 방법·절차·도구를 제공하는 행위
    include_criteria:
    - 절도·갈취·밀수·위조·침입 등 범죄 실행·은폐 방법이 실제로 공유되거나 적발된 사건
    - 관련 범죄 단속, 처벌, 재판 보도
    exclude_criteria:
    - 범죄예방 캠페인이나 안전 수칙을 안내하는 계도 콘텐츠
