# 본문 추출/정제 설정 (9절).

fetch:
  timeout_seconds: 15
  user_agent: "Mozilla/5.0 (compatible; CAGE-KoreaCrawler/1.0)"

cleaning:
  strip_html: true
  collapse_blank_lines: true      # 문단 개행은 유지하되 과도한 빈 줄만 정리
  normalize_whitespace: true
  remove_duplicate_paragraphs: true
  duplicate_paragraph_min_length: 80  # 짧은 제목/목록 항목은 반복되어도 유지
  # 본문 맨 앞에서부터 이 길이 이하인 줄이 연달아 나오면(네비게이션 메뉴 등) 잘라낸다.
  # 실제 기사 문단을 만나는 순간(길이 초과) 멈춘다. 0이면 끔 (2026-08-26: a-ha.io 등에서 실측).
  leading_short_line_max_length: 10
  # 아래 문구가 문단 첫머리에 나오면 그 지점부터 작성자 소개·저작권 영역으로 보고 제거한다.
  trailing_section_markers:
    - "필자 소개"
    - "필자소개"
    - "기자 소개"
    - "기자소개"
    - "[글_"
    - "[글="
    - "저작권자"
    - "<저작권자"
    - "로톡의 모든 콘텐츠는"   # lawtalk.co.kr 저작권 안내 고정문구 (2026-08-26 실측: 16건 누락 확인)
    - "ⓒ"                    # 한국 뉴스매체 공통 저작권 표기("ⓒ 한경닷컴, 무단전재 및 재배포 금지" 등)
    - "무단전재"               # 위와 같은 문구가 ⓒ 없이 나오는 경우 (2026-08-26 실측: hankyung.com 7/7건 누락)
    - "Copyright"             # 영문 저작권 고지 ("@Copyright OOO. All Right Reserved." 등)
    - "상단의 좋아요"           # "칼럼이 도움이 됐다면 상단의 좋아요 버튼을 눌러주세요" 류 공유 유도 문구
    - "후원은 더 좋은 기사에"    # mediatoday.co.kr 후원 유도 문구 (2026-08-26 실측: 19/19건 누락 확인)

# trafilatura(본문 추출 라이브러리) 옵션. 댓글·관련기사 등을 빼고 메인 본문만 가져오게 한다.
trafilatura:
  include_comments: false   # 댓글/답글 제외 (9.2절: 답글은 본문과 구분, 기본은 제외)
  favor_precision: true     # 애매하면 "덜 가져오고 정확하게" 쪽을 택함 (재현율보다 정밀도 우선)

# 한국 관련성 판단 (11.2절 4번). OpenAI 없이 한글 비율로만 본다 (사용자 결정, 2026-08-25).
korea_relevance:
  min_korean_ratio: 0.3   # 제목+본문 중 한글 비율이 이보다 낮으면 low_korea_relevance로 제외

# taxonomy 적합성 판단 (11.2절 8~11번, OpenAI 호출). 기본은 꺼둔다 — 켜면 광고성/위키형/일반정의/
# taxonomy 부적합 콘텐츠도 걸러지지만 콘텐츠당 OpenAI 호출이 1번 더 생긴다. "4. 실행 및 결과" 화면에서
# 실행 시점에 켜고 끌 수 있다 (사용자 결정, 2026-08-25).
taxonomy_filter:
  enabled: false

# 댓글 단위 유해 신호 분리용 설정 (self_injury처럼 원글은 도움 요청이고 댓글에만 위험한 응답이
# 달리는 경우를 위함). src/extraction/comments.py의 select_comments()가 참조한다.
# 주의: 사이트별 파서가 실제로 댓글을 긁어오는 부분은 아직 구현되지 않았다 — 여기 있는 건
# "댓글 후보 목록이 주어졌을 때 대표 댓글을 어떻게 고를지"에 대한 선택 로직/설정뿐이다.
comment_extraction:
  max_comments: 3
  selection_priority:
    - taxonomy_relevance
    - reaction_count
    - representative_or_author_selected

# source_category별 최소 본문 길이(자수). 이보다 짧으면 extraction_failed 처리한다.
min_content_length:
  news: 200
  community: 50
  qna: 80
  default: 100
