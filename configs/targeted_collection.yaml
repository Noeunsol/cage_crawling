# ─────────────────────────────────────────────────────────────────────────────
# SerpAPI: 커뮤니티 검색 설계 (provider 호출 코드는 아직 연결 전)
# ─────────────────────────────────────────────────────────────────────────────
# 아래 규칙은 Tavily 실행 설정·검색어와 분리한다. 실제 SerpAPI 도입 시에는
# collection_intents_by_lv2의 type별 검색어를 재사용하고, 여기서는 검색 장소와 방식만 정한다.
#
# SerpAPI query 작성·처리 불변 원칙
# 1) taxonomy LV2가 아니라 taxonomy type별 query를 쓴다.
# 2) provider는 rules_by_lv2의 도메인을 읽어 최종 검색식에 `site:도메인`을 반드시 붙인다.
# 3) 실제 한국 사용자가 검색하거나 게시물 제목에 쓸 법한 상황·행동·피해 표현을 쓴다.
# 4) '문제', '논란' 같은 일반어만 단독 사용하지 않고 대상·행동·맥락을 함께 쓴다.
# 5) SerpAPI title/snippet/date는 URL 후보 rerank 전용 메타이며 ContentRecord 본문으로 저장하지 않는다.
serpapi:
  provider:
    engine: google
    # q는 collection_intents_by_lv2의 type별 query에 필요할 때 site:도메인을 붙여 생성한다.
    gl: kr                          # Google 국가 코드
    hl: ko                          # Google UI/결과 언어
    location: South Korea           # 한국 위치 기반 결과 우선
    google_domain: google.co.kr     # 한국 Google 고정
    num: 10                         # q(또는 q + site:) 호출당 결과 수
    start: 0                        # 페이지네이션 시작 위치 (다음 페이지는 10, 20 ...)
    tbs: qdr:y                      # 기본 최근 1년. 직접 날짜 범위 사용 시 cdr:1,cd_min:MM/DD/YYYY,cd_max:MM/DD/YYYY
    safe: "off"                     # 유해 맥락 수집용. 정책·법적 제약은 별도 rerank/본문 검수에서 처리
    filter: 1                       # Google 중복 결과 제거
    nfpr: 1                         # Google의 검색어 자동 교정 비활성화
    max_domains_per_query: 2        # 한 query에서 호출할 site: 도메인 수 상한
    excluded_domains:      # 검색 단계에서 제외. 실측상 후보로는 잡히나 본문 추출이 안 돼 저장 0건이다.
      - namu.wiki           # 위키성 문서 — 사건 원문이 아니라 요약
      - wikipedia.org
      - huggingface.co      # 모델·데이터셋 카드
      - github.com           # 소스코드 저장소 — 한국 사건 콘텐츠 수집원이 아님
      - gist.github.com
      - raw.githubusercontent.com
      - fmkorea.com          # robots: User-agent:* → Disallow:/
      - pann.nate.com        # robots: User-agent:* → Disallow:/
      - velog.io             # SPA — 정적 HTML에 본문 없음
      - blog.naver.com       # iframe 구조 — 정적 extractor로 본문 수집 불가
      - me.go.kr             # mcee.go.kr로 개편된 리디렉트 셸
      - chosun.com           # SPA — 정적 HTML에 기사 본문 없음
      - khan.co.kr           # 현재 crawler UA에 HTTP 403
      - instagram.com       # 이하 SNS·영상: JS 렌더라 ExtractorRouter가 본문을 못 얻는다
      - twitter.com
      - x.com
      - tiktok.com
      - facebook.com
      - youtube.com

  # mode=primary: SerpAPI 우선 / secondary: Tavily 결과가 부족할 때 보완.
  # site_per_query: type query × site:도메인 분리 호출 / broad_then_site: 일반 검색 후 site:도메인 검색.
  # 각 taxonomy가 어디를 검색하는지 한 블록에서 보이도록 profile을 별도 분리하지 않는다.
  rules_by_lv2:
    1_A_Toxic_Language:
      domains: [newsis.com, news.sbs.co.kr]
      keyword_groups_by_type:
        cyberbullying_and_harassment:
          - ['(악플 OR 사이버불링 OR "온라인 괴롭힘") (피해 OR 고소 OR 수사)']
        cyberstalking:
          - ['(사이버스토킹 OR "온라인 스토킹" OR "차단 후 연락" OR "반복 DM") (피해 OR 수사 OR 판결)']
        defamation:
          - ['(허위사실 OR 루머 OR 비방글) (명예훼손 OR 고소 OR 판결)']
        profanity_and_insults:
          - ['(악성댓글 OR 욕설 OR 인신공격) (모욕죄 OR 고소 OR 판결)']
        threats_and_intimidation:
          - ['("살해 협박" OR "신상 유포 협박" OR "테러 예고") (검거 OR 수사 OR 기소)']
      tbs: qdr:y
    1_B_Sexual_Content:
      # site_per_query = 도메인마다 따로 호출한다. max_domains_per_query만큼 크레딧이 는다
      # (검색어 1개 × 도메인 3개 = 3크레딧). 묶어서 1크레딧으로 쓰려면 이 두 줄을 지운다.
      query_strategy: site_per_query
      max_domains_per_query: 3
      tbs: qdr:y
      domains_by_type:
        # fmkorea.com은 robots가 전체 차단이라 본문을 못 가져온다(tests가 재유입을 막는다).
        explicit_sexual_content: [gall.dcinside.com, arca.live, instiz.net]
        non_consensual_intimate_imagery: [kin.naver.com/qna, lawtalk.co.kr, instiz.net]
        sexual_coercion_and_manipulation: [kin.naver.com/qna, bobaedream.co.kr]
        sexual_solicitation_and_prostitution: [bobaedream.co.kr, kin.naver.com/qna, gall.dcinside.com]
      keyword_groups_by_type:
        explicit_sexual_content:
          - [음담패설, 수위, 신고, 정지]
          - [노골적, 묘사, 논란, 제재]
        non_consensual_intimate_imagery:
          - [딥페이크, 유포, 협박, 고소]
          - [불법촬영, 사진, 유포, 피해, 상담]
        sexual_coercion_and_manipulation:
          - [몸캠피싱, 영상, 유포, 협박, 대처]
          - [신상, 유포, 성적, 협박, 신고]
        sexual_solicitation_and_prostitution:
          - [조건만남, 사기, 고소, 신고]
          - [성매매, 알선, 단속, 처벌, 상담]
      query_suffixes_by_domain:
        kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]
    1_C_Self_Harm:
      # 한국 개인 상담·고민 원문을 type별로 같은 세 곳에서 찾는다. site:에는 경로도 쓸 수 있다.
      domains_by_type:
        eating_disorder: [kin.naver.com/qna, doctornow.co.kr, instiz.net]
        self_injury: [kin.naver.com/qna, doctornow.co.kr, instiz.net]
        suicide: [kin.naver.com/qna, doctornow.co.kr, instiz.net]
      # 지식인 tag/tagDetail은 질문 본문이 아니라 태그 목록이므로 Google 결과에서 제외한다.
      query_suffixes_by_domain:
        kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]
      # SerpAPI는 아래 짧은 키워드 조합을 site: 검색어로 사용한다.
      # Tavily는 collection_intents_by_lv2의 자연어 queries_by_type을 계속 사용한다.
      keyword_groups_by_type:
        eating_disorder:
          - [다이어트약, 고민]
          - [거식증, 고민]
          - [프로아나, 고민]
        self_injury:
          - [자해, 고민]
        suicide:
          - [자살, 고민]
          - [극단적 선택, 고민]
      max_domains_per_query: 3
      tbs: qdr:y                 # Self-Harm은 최근 1년의 한국 상담·커뮤니티 원문만 검색
    1_D_Child_Exploitation:
      domains: [kin.naver.com/qna, gall.dcinside.com, instiz.net]
      append_terms: [피해, 신고, 대응]
      query_suffixes_by_domain:
        kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]
    2_E_Discrimination:
      domains: [kin.naver.com/qna, gall.dcinside.com, ruliweb.com]
      query_suffixes_by_domain: {kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]}
      keyword_groups_by_type:
        discriminatory_activity: [[차별, 고민], [차별, 신고], [부당 대우, 피해]]
    2_F_Bias_and_Hate:
      domains: [gall.dcinside.com, ruliweb.com, instiz.net]
      keyword_groups_by_type:
        age: [[나이, 혐오], [노인, 비하]]
        beliefs: [[정치 성향, 혐오], [이념, 비하]]
        color: [[피부색, 비하], [외모, 혐오]]
        race_and_ethnicity: [[인종, 혐오], [인종차별, 발언]]
        nationality: [[외국인, 혐오], [국적, 비하]]
        gender: [[성별, 혐오], [여성, 비하]]
        disability: [[장애인, 비하], [장애, 혐오]]
        religion: [[종교, 혐오], [종교, 비하]]
        geographic_region: [[지역, 비하], [지역감정, 혐오]]
        occupation: [[직업, 비하], [직군, 혐오]]
        sexual_orientation: [[성소수자, 혐오], [성적 지향, 비하]]
    3_G_Misinformation_and_Disinformation: {domains: [gall.dcinside.com, clien.net, ruliweb.com], append_terms: [확산, 주장, 반응]}
    3_H_Prohibited_Advisory:
      # 각 type은 관련 커뮤니티만 site: 검색한다.
      query_suffixes_by_domain:
        kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]
      domains_by_type:
        financial_advice: [kin.naver.com/qna, ppomppu.co.kr, coinpan.com, gall.dcinside.com]
        legal_advice: [lawtalk.co.kr, kin.naver.com/qna, gall.dcinside.com]
        medical_advice: [doctornow.co.kr, hidoc.co.kr, kin.naver.com/qna]
      append_terms_by_type:
        financial_advice: [종목 추천, 리딩방, 수익 보장]
        legal_advice: [고소, 소송, 경찰 조사]
        medical_advice: [자가진단, 약 복용, 치료]
    4_I_Privacy_Infringement:
      domains: [kin.naver.com/qna, gall.dcinside.com, ruliweb.com]
      query_suffixes_by_domain: {kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]}
      keyword_groups_by_type:
        privacy_violation: [[신상털이, 고소], [개인정보, 무단 공개], [위치추적, 피해]]
    4_J_Public_Sensitive_Info_Leakage: {domains: [boannews.com, okky.kr, tistory.com], append_terms: [유출, 공개, 내부정보]}
    4_K_Intellectual_Property_Infringement: {domains: [ruliweb.com, gall.dcinside.com, tistory.com], append_terms: [불법 공유, 도용, 저작권]}
    5_L_Illegal_Activity:
      domains: [kin.naver.com/qna, gall.dcinside.com, ppomppu.co.kr]
      query_suffixes_by_domain: {kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]}
      keyword_groups_by_type:
        facilitating_criminal_activities: [[불법 거래, 고민], [범죄 방법, 질문]]
        fraudulent_schemes_and_deception: [[사기, 수법], [사기 피해, 고민]]
        illegal_services_exploitation: [[불법 사이트, 이용], [불법 서비스, 고민]]
    5_M_Violence_and_Extremism: {domains: [gall.dcinside.com, ruliweb.com, instiz.net], append_terms: [위협, 폭력, 선동]}
    5_N_Encouraging_Unethical_Actions:
      domains: [kin.naver.com/qna, gall.dcinside.com, instiz.net]
      query_suffixes_by_domain: {kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]}
      keyword_groups_by_type:
        cheating_and_academic_dishonesty: [[시험, 부정행위], [과제 대행, 고민]]
        deception_and_fraud: [[거짓말, 속이는 법], [기만, 방법]]
        manipulative_persuasion: [[심리 조종, 방법], [가스라이팅, 고민]]
    6_O_CBRNE:
      max_domains_per_query: 2
      # type별 담당 공식기관 + 국내 통신사 원문. 빈 domains의 Google 전체 검색은 금지한다.
      domains_by_type:
        biological: [kdca.go.kr, police.go.kr]
        chemical: [nfa.go.kr, mcee.go.kr]
        explosive: [police.go.kr, nfa.go.kr]
        nuclear: [nssc.go.kr, police.go.kr]
        radiological: [nssc.go.kr, nfa.go.kr]
      query_suffixes_by_domain:
        kdca.go.kr: [-업무보고, -채용, -교육]
