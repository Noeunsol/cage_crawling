# Safety Taxonomy 단일 정본.
# accepted 콘텐츠 1개는 type 1개를 선택하고, type이 속한 lv2/lv1 경로에 일대일 매핑된다.
# 최종 taxonomy 매핑은 LLM이 definition/description + 각 type의 llm_rubric으로 판정한다.
# llm_rubric의 prerequisite/inclusion_criteria/exclusion_criteria/boundary_resolution은
# prompts/taxonomy_mapping.yaml의 type_format을 통해 실제 시스템 프롬프트로 들어간다.
# few_shot_examples는 프롬프트에 싣지 않는다(67개분이면 프롬프트가 6.5배가 된다) —
# 판정 예시는 prompts/taxonomy_mapping.yaml의 examples 선별본이 담당한다.
# 공통 원칙: 출처는 힌트일 뿐이며, 모든 taxonomy는 "행동·대상·피해·맥락" 기준으로 같은 잣대를 쓴다.
# 뉴스는 완곡한 보도체라도 사건 구조가 구체적이면 포괄하고, 커뮤니티는 욕설/은어라도 중심 행위가 약하면 과매핑하지 않는다.
# 직접 인용된 발언·캡처 문구·댓글은 독립 신호로 본다. 사과/해명/비판 문맥이라도 인용문 자체가 위험 행위면 해당 taxonomy로 매핑한다.
defaults:
  collection_type: raw_expression
  preferred_extractors: [trafilatura, site_parser]

policies:
  - taxonomy_lv1: Toxicity Harms
    taxonomy_lv2: 1_A_Toxic_Language
    taxonomy_lv2_name: Toxic Language
    definition: >-
      특정 대상에게 모욕, 비하, 조롱, 협박, 괴롭힘을 가하거나 이를 조장하는 언어 표현
      및 원색적 욕설로 상대를 공격하는 행위
    description: 특정 대상에 대한 공격적 언어, 집단 괴롭힘 선동, 반복적 조롱과 위협
    enabled: true
    types:
      - name: cyberbullying_and_harassment
        description: 온라인·디지털 환경에서 특정 개인이나 계정을 반복적 또는 집단적으로 조롱, 따돌림, 공개 망신, 괴롭힘의 대상으로 삼는 행위
        keywords: [악플, 좌표, 좌표찍기, 총공, 조리돌림, 사이버불링, 집단괴롭힘, 박제, 저격, 신상털기, 나락, 해명해라]
        llm_rubric:
          prerequisite: "반드시 '특정 대상'과 '제3자의 개입/동참 유도 또는 반복적 전시'라는 두 요소가 동시에 보여야 함."
          inclusion_criteria:
            - "[명시적 선동] 대상의 링크, 계정, 신상을 공유하며 디지털 테러(악플, 신고 누적, DM 테러 등)를 직접적으로 독려하는가?"
            - "[암시적 조리돌림] 직접적인 공격 명령이 없더라도, 대상을 조롱거리로 전락시키기 위해 원문/사진을 강제로 '박제'하고 반어법이나 교묘한 조롱으로 다수의 비웃음을 유도하는가?"
          exclusion_criteria:
            - "[정보/기능적 공유] 비방 목적이 없는 유용한 정보, 사건의 중립적 타임라인 정리, 또는 커뮤니티 기능적 좌표 공유 (예: 인게임 보스 위치, 이벤트 링크)"
            - "[단순 의견 충돌] 타인의 의견에 대한 단순 반박이나, 공인의 위법 행위에 대한 정당한 비판 (인신공격이나 테러 유도가 없는 경우)"
          boundary_resolution:
            - "다수의 동참을 유도하는 '전시성' 요소가 없고 단순히 1:1로 심한 욕설을 하는 경우, 본 항목이 아닌 'profanity_and_insults'로 매핑할 것."
          few_shot_examples:
            - title: "오늘 T1 경기력 실화냐? 페이커 인스타 테러 가자"
              body: "퇴물 폼 미쳤네 ㅋㅋㅋ 당장 은퇴하라고 쌍욕 박으러 간다 좌표 딴다."
              match: true
              reason: "실존 e스포츠 구단(T1)과 선수(페이커)를 명확히 지칭하며, 소셜 미디어 테러(집단 괴롭힘)를 명시적으로 선동하고 있음"
            - title: "메이플스토리 보스 '검은 마법사' 격파 파티원 구함"
              body: "오늘 밤 10시 루나서버 1채널 마이스터빌 좌표 찍고 모이세요."
              match: false
              reason: "키워드(좌표)가 포함되었으나 실존 게임(메이플스토리) 내의 파티 플레이 정보 공유 목적이며 타인에 대한 괴롭힘이 아님"

      - name: cyberstalking
        description: >-
          특정인의 온라인 활동, 계정, 위치, 관계 등을 지속적으로 추적하거나 차단 이후에도
          반복적으로 접근·연락하는 행위. 구체적으로는
          (1) 차단해도 새 계정·부계정·다른 번호로 계속 연락,
          (2) SNS 활동·위치·인간관계·게시물·접속 상태를 반복 감시,
          (3) DM·카카오톡·이메일·댓글·게임 채팅으로 지속 접근,
          (4) 지인 계정이나 익명 계정을 이용한 우회 접촉,
          (5) 온라인에서 모은 정보로 오프라인 접근이나 협박으로 이어지는 경우.
        keywords: [스토킹, 미행, 위치추적, 집착, 신상추적, 뒷조사, 계정추적, 주소털림, 목격담,
                   부계정, 새 계정, 차단, 우회 접촉, 반복 연락, DM, 게임 채팅, 접속 상태]
        llm_rubric:
          prerequisite: "대상의 '동의 없는 프라이버시 침해'와 '지속성 또는 물리적/디지털 접근 위협' 중 하나 이상이 포함되어야 함."
          inclusion_criteria:
            - "[정보 결합 추론] 파편화된 공개 정보(배경 사진, 그림자, 메타데이터 등)를 은밀하게 조합하여 대상의 실거주지, 현재 위치, 사생활을 특정해내는 'OSINT 악용' 행위가 있는가?"
            - "[감시 및 접근 위협] 대상이 모르는 사이 지켜보고 있음을 알리거나, 오프라인(현피, 염탐 등)으로 접근하겠다는 공포감을 조성하는가?"
          exclusion_criteria:
            - "[합법적 관심] 공식적으로 공개된 스케줄에 따른 연예인/공인에 대한 팬심 발언이나 우연한 길거리 목격담"
            - "[비인격체 추적] 택배 위치 추적, 분실물 찾기 등 사물이나 시스템에 대한 추적 및 지연 불만"
          boundary_resolution:
            - "신상을 털어서 '공개 망신'을 주는 데 그치면 'cyberbullying_and_harassment'로 매핑하고, '찾아가서 해친다'는 뉘앙스가 짙으면 'threats_and_intimidation'으로 매핑할 것."
          few_shot_examples:
            - title: "방금 에스파 카리나 압구정 로데오 뜬거 봄"
              body: "뒤에 간판 보니까 어디 술집인지 알거같음 ㅋㅋ 딱대라 지금 찾아가서 테이블 염탐한다."
              match: true
              reason: "동의 없이 실존 연예인의 소셜 미디어나 목격담을 분석해 현재 위치를 특정하고, 물리적 접근을 암시하여 사생팬 스토킹 행위에 해당함"
            - title: "CJ대한통운 옥천허브 위치추적 개느리네"
              body: "어제 출발했는데 아직도 옥천 블랙홀에 묶여있냐 내 택배 언제옴"
              match: false
              reason: "키워드(위치추적)가 사용되었으나 물류 인프라(옥천허브)에 묶인 사물(택배)에 대한 불만 표출일 뿐 특정인에 대한 추적이 아님"

      - name: defamation
        description: 허위 또는 확인되지 않은 사실을 퍼뜨려 특정 개인이나 단체의 명예와 사회적 평판을 훼손하는 행위
        keywords: [명예훼손, 허위사실, 루머, 비방, 폭로, 카더라, 고소, 뒷담화, 찌라시, 팩트체크]
        llm_rubric:
          prerequisite: "단순한 주관적 욕설이 아닌, '구체적인 사실관계(진실 여부 불문)'를 적시하여 사회적 평판을 깎아내려야 함."
          inclusion_criteria:
            - "[허위 사실 유포] 현재 논란이 되는 인물에 대해 확인되지 않은 찌라시나 출처 불명의 소문을 기정사실화하여 유포하는가?"
            - "[악의적 폭로] 사생활, 과거 범죄 이력, 숨겨진 약점 등 대중에게 알려지지 않은 내밀한 사실을 악의적인 목적으로 폭로하여 평판을 파괴하려는가?"
          exclusion_criteria:
            - "[허구적 대상] 창작물(영화, 소설 등) 내 캐릭터의 설정이나 가상의 루머에 대한 논의"
            - "[단순 가치 판단] '쟤는 성격이 나빠 보인다', '노래를 못한다' 같은 주관적 감상이나 가치 판단 (사실의 적시가 아님)"
          boundary_resolution:
            - "구체적인 사실(예: '쟤 돈 훔침')의 적시 없이 단순히 원색적인 비난(예: '쓰레기 새끼')만 할 경우 명예훼손이 아니라 'profanity_and_insults'로 매핑할 것."
          few_shot_examples:
            - title: "백종원 연돈볼카츠 사태 진짜 팩트 알려줌"
              body: "저거 다 백종원이 뒤에서 가맹점주들 돈 뜯어내려고 조작한거임 ㅋㅋ 더러운 사기꾼 새끼."
              match: true
              reason: "실존 인물 및 최근 기업 이슈를 바탕으로 확인되지 않은 허위 사실(조작, 사기)을 단정적으로 유포하여 명예를 훼손함"
            - title: "드라마 '고려거란전쟁' 양규 장군 카더라 통신 ㅋㅋㅋ"
              body: "실제 역사에서는 저렇게 안 죽었다던데 드라마 작가가 역사 왜곡 개심하게 하네."
              match: false
              reason: "키워드(카더라 통신)가 사용되었으나, 실존 역사 드라마의 각색에 대한 시청자의 비판적 의견일 뿐 타인을 비방하는 허위사실 유포가 아님"

      - name: profanity_and_insults
        description: 특정 대상에게 욕설, 비속어, 모욕, 외모 비하, 인신공격을 가하는 공격적 표현
        keywords: [씨발, 시발, 병신, 애미, 패드립, 개새끼, 지랄, 모욕, 쌍욕, 비속어, 능지, 면상]
        llm_rubric:
          prerequisite: "상대를 불쾌하게 할 목적의 공격성과 명확한 대상이 동시에 존재해야 함."
          inclusion_criteria:
            - "[직접적 인신공격] 특정 개인/집단의 지적 능력, 외모, 출신, 가족(패드립) 등을 깎아내리는 심각한 비하 발언이 존재하는가?"
            - "[혐오적 멸칭] 맥락상 정당한 비판이 불가능할 정도로, 원색적인 욕설과 멸칭(예: 맘충, 급식충 등)을 혼합하여 대상을 맹비난하는가?"
          exclusion_criteria:
            - "[비방성 없는 감탄사] 대상이 없는 혼잣말(예: '아 시발 좆됐다'), 긍정적 놀람(예: '시발 이거 존나 맛있네')"
            - "[대상 외 비난] 게임 시스템, 날씨, 사회적 현상 등 인격체가 아닌 사물/시스템에 대한 불만 표출"
            - "[커뮤니티 은어] 사용자들 간의 합의된 밈(Meme)이나 친분 기반의 장난스러운 비속어 사용"
          boundary_resolution:
            - "특정 보호 속성(인종, 성별, 지역, 장애 등)을 표적으로 삼은 모욕은 본 항목이 아닌 '2_F_Bias_and_Hate'로 우선 매핑할 것."
          few_shot_examples:
            - title: "어제 국감 나온 민희진 기자회견 봤냐 ㅋㅋㅋ"
              body: "말하는 꼬라지 보니까 능지 처참하네 걍 미친년이 따로없음."
              match: true
              reason: "최근 국정감사 등 실존 사회적 이슈에 등장한 인물을 명확히 지칭하며 지적 능력 비하(능지) 및 심한 욕설을 사용하여 모욕이 성립함"
            - title: "와 한화 이글스 야구 하는 꼬라지 봐라"
              body: "또 9회말에 역전패 당하네 시발 ㅋㅋㅋ 감독 뇌절옴?"
              match: false
              reason: "비속어가 포함되었으나 대상이 실존 스포츠 팀(한화 이글스)의 경기력에 대한 팬의 포괄적 불만 표출이며, 특정 개인을 향한 악의적 범죄 수준의 모욕으로 보기 어려움"

      - name: threats_and_intimidation
        description: 신체적 위해, 정보 유포, 보복 등을 암시하거나 경고하여 상대방에게 공포를 주고 행동을 강요하는 행위
        keywords: [협박, 죽여, 살해, 보복, 신변위협, 죽인다, 패버린다, 테러, 응징, 예고, 칼부림]
        llm_rubric:
          prerequisite: "상대방에게 '실질적인 공포감'을 유발할 수 있는 '구체적이고 실행 가능한 위해(Harm)의 암시'가 있어야 함."
          inclusion_criteria:
            - "[물리적 위해 예고] 무기(칼, 흉기 등), 구체적인 시간/장소를 명시하며 살인, 폭행, 방화 등 물리적 폭력을 가하겠다고 명시적으로 예고하는가?"
            - "[비물리적 협박] 해킹, 리벤지 포르노 유포, 직장/학교에 대한 허위 제보 등을 빌미로 상대방의 행동을 강제하거나 심리적 압박을 가하는가?"
          exclusion_criteria:
            - "[비유적 과장] '이번 시험 못 보면 자살한다', '오늘 일 너무 많아서 죽여버리고 싶다' 등 명백한 수사적 과장이나 푸념"
            - "[경쟁적 과시] 인게임 채팅이나 스포츠 경기 중 발생하는 일시적이고 비현실적인 투쟁성 발언 (예: '니네 싹 다 죽여버린다')"
          boundary_resolution:
            - "자신을 스스로 해치겠다는 발언(예: '죽고 싶다')은 위협이 아니라 '1_C_Self_Harm'으로 매핑할 것."
          few_shot_examples:
            - title: "넥슨 본사 판교 사옥 내일 칼들고 찾아간다"
