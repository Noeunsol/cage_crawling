  6_O_CBRNE:
    modes: [official_seed]   # 코드가 읽는 유일한 값. 2-hop(공식기관 seed → 뉴스 본문)을 켠다
    # 사건어+물질어를 제목·snippet에서 확인하므로 여기만 긴 snippet(advanced)이 필요하다.
    search_depth: advanced
    recency_days: 730               # 사건 자체가 드물어 창을 넓게 둔다
    target_types:
      biological: {query_budget: 4}
      chemical: {query_budget: 5}
      explosive: {query_budget: 5}
      nuclear: {query_budget: 4}
      radiological: {query_budget: 4}
    # 공식기관은 '어떤 사건이 있었는지'를 알아내는 seed로만 쓴다(metadata_only → 본문 fetch 안 함).
    # 실측 결과 .go.kr SERP는 '목 차'·'알림마당'·'종합대책 이행계획' 같은 행정문서가 태반이라
    # 본문을 가져와도 저장 가치가 없었다. 사건 원문은 국내 언론에서 가져온다.
    sources:
      - {id: fire_agency,    access: metadata_only, method: official_board, domain: nfa.go.kr,    priority: 1}
      - {id: nuclear_safety, access: metadata_only, method: official_board, domain: nssc.go.kr,   priority: 1}
      - {id: police,         access: metadata_only, method: official_board, domain: police.go.kr, priority: 1}
      - {id: kdca,           access: metadata_only, method: official_board, domain: kdca.go.kr,   priority: 1}
      # 환경부는 2026년 기후에너지환경부로 개편됐다. me.go.kr는 리디렉트 셸이라 본문이 없다.
      - {id: environment,    access: metadata_only, method: official_board, domain: mcee.go.kr,   priority: 1}
      # 2라운드: 위 seed로 만든 사건 검색어로 국내 뉴스 본문을 수집한다(여기가 최종 콘텐츠).
      - id: news
        access: direct
        method: serpapi_site
        # 2026-08 실측으로 정적 추출이 확인된 매체만. 조선(JS렌더)·경향(403)·한겨레(미확인)는 뺐다.
        domains: [yna.co.kr, newsis.com, donga.com, news.sbs.co.kr]
        priority: 2
      - {id: web, access: direct, method: web_search, priority: 3}
    permissive_collection: true
    planner:
      query_kinds: [event, source]
      required_context: [incident, investigation, enforcement, response]
      # LLM에 맡기지 않고 query_planner가 문자열 규칙으로 한 번 더 차단한다.
      forbidden_intents: [manufacturing, synthesis, procurement, optimization, weaponization]
    acceptance:
      korea_evidence: [korean_organization, korean_location]

