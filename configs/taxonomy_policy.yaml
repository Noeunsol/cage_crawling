# Phase 0 — Taxonomy 수집 정책 (collection_type 모델, 설계서 §5·§7).
# taxonomy 레벨에 둔 필드(collection_type/primary_methods/preferred_extractors/
# preservation_policy/thresholds/filter_mode/max_pii_risk)는 하위 subtype 전체가 상속.
# subtype에서 같은 키를 다시 쓰면 override. policy_loader는 enabled:true 만 실행.
policies:
  - taxonomy_lv2: Toxic Language
    enabled: true

    # ── taxonomy 공통(상속) 정책 ──
    collection_type: raw_expression          # 실제 사용자 표현·댓글·조롱 수집
    primary_methods: [board_list, serpapi_site]
    preferred_extractors: [site_parser, playwright, trafilatura]
    filter_mode: minimal                     # raw 수집은 약한 URL 필터 + 강한 matcher
    preservation_policy:
      preserve_harmful_expression: true      # 욕설/협박 표현은 taxonomy 신호 → 보존
      mask_pii: true
      restrict_actionable_detail: false
      mask_credentials: true
    thresholds:
      min_taxonomy_fit_score: 0.75
      min_harmfulness_score: 0.65
      min_seed_source_value_score: 0.60
    max_pii_risk: 1.0

    subtypes:
      - name: Profanity and Insults
        description: 욕설·비속어·모욕 표현
        keywords: [욕설, 비속어, 패드립, 모욕, 악플, 쌍욕]
        positive_patterns: [온라인 커뮤니티, 댓글, 모욕]
        negative_patterns: [영화 리뷰, 단순 감상]
        priority_sites: [dcinside, fmkorea, humoruniv, ruliweb]

      - name: Defamation
        description: 허위사실 유포 및 명예훼손
        keywords: [명예훼손, 허위사실, 루머, 비방, 폭로]
        positive_patterns: [온라인 커뮤니티, 댓글, 고소]
        negative_patterns: [영화 리뷰, 단순 감상]
        priority_sites: [nate_pann, dcinside, fmkorea, clien]

      - name: Harassment
        description: 지속적 괴롭힘·조롱
        keywords: [괴롭힘, 조롱, 조리돌림, 박제, 망신주기]
        positive_patterns: [온라인 커뮤니티, 댓글, 반복]
        negative_patterns: [영화 리뷰, 단순 감상]
        priority_sites: [dcinside, fmkorea, nate_pann, humoruniv]

      - name: Cyberbullying
        description: 온라인 집단 괴롭힘
        keywords: [사이버불링, 악플, 좌표찍기, 총공, 온라인폭력]
        positive_patterns: [온라인 커뮤니티, 댓글, 집단 공격, 피해]
        negative_patterns: [영화 리뷰, 드라마, 단순 감상]
        priority_sites: [dcinside, nate_pann, fmkorea, inven]
        target_harm_signals: [악플, 좌표찍기, 조리돌림, 사이버불링, 온라인폭력]

      - name: Threats and Intimidation
        description: 협박 및 위협
        keywords: [협박, 살해협박, 보복, 신변위협, 협박 DM]
        positive_patterns: [온라인 커뮤니티, 댓글, 신고]
        negative_patterns: [영화 리뷰, 단순 감상]
        priority_sites: [dcinside, nate_pann, fmkorea, news_generic]

      - name: Stalking
        description: 온라인·오프라인 스토킹
        keywords: [스토킹, 미행, 위치추적, 집착, 신상추적]
        positive_patterns: [온라인 커뮤니티, 댓글, 사생활]
        negative_patterns: [영화 리뷰, 단순 감상]
        priority_sites: [nate_pann, dcinside, naver_kin, news_generic]

  # ── 나머지 taxonomy는 placeholder (이후 사람이 채움) ──
  - taxonomy_lv2: Adult Content
    enabled: false
    subtypes: []

  - taxonomy_lv2: Violence
    enabled: false
    subtypes: []
