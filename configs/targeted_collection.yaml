# 민감 LV2: 위 queries가 맥락(사건 보도·수사·정책)을 제한하고, 여기서 강제 review + 감점 신호를 준다.
# queries에 제조/조달/유통 어휘가 들어가면 validate_collection_intent가 blocked로 실행을 막는다.
sensitive_overlay: 
  1_D_Child_Exploitation:
    disallowed_intents: [material_sharing, explicit_media, how_to]
    force_review: true
  6_O_CBRNE:
    disallowed_intents: [manufacturing, synthesis, procurement, how_to]
    force_review: true

rerank:                             # fetch 전 필터. rule 먼저 → 애매한 후보만 LLM.
  min_discovery_relevance: 0.65
  min_discovery_relevance_floor: 0.40  # 이보다 낮으면 본문 수집하지 않음
  min_korea_relevance: 0.60
  llm_margin: 0.15                  # rule 점수가 임계±margin일 때만 LLM 호출

limits:                             # 폭주 상한. Streamlit UI가 덮어쓴다.
  max_selected_lv2: 19
  # 0 = LV2별 상한 없음. taxonomy별로 배분하지 않고 총예산까지 계속 모은다.
  # 고정값을 두면 첫 LV2가 상한에 막혀 이미 검색비를 치른 후보를 그냥 버린다
  # (실측: 후보 179건 중 133건이 이렇게 날아갔다). 폭주 방어는 max_total_fetch 하나로 본다.
  max_fetch_per_lv2: 0             # 1회 실행 상한. 누적 목표 100건은 여러 번 실행해 채운다
  max_fetch_per_type: 6             # type 여러 개인 LV2에서 한 type 독식 방지. 단일 type LV2엔 미적용
  max_total_fetch: 800            # fetch는 무료(HTTP)다. 검색 크레딧은 이 앞에서 이미 썼다

# 사후 재검수(phase2/review.verify_unverified_candidates)의 본문 판정 기준.
# 수집 중에는 쓰이지 않는다 — 수집 시 저장 판정은 default_acceptance + acceptance gate가 한다.
acceptance:
  broad_candidate: true
  min_taxonomy_fit_score: 0.45
  min_korea_relevance_score: 0.30
  min_concrete_context_score: 0.20

adjudication:
  permissive_collection: true      # 2차는 검색 목표 taxonomy를 신뢰. 추출 실패·중복만 제외
  # 아래는 사후 재검수 전용이다(수집 중 LLM 본문 재분류는 v23에서 제거).
  allow_opportunistic_accept: true  # predicted != target 여도 predicted가 부족하면 저장

# ─────────────────────────────────────────────────────────────────────────────
# 2차 수집 계약 (source_strategies_by_lv2 경로)
# ─────────────────────────────────────────────────────────────────────────────
# 목표: 검색 목표 taxonomy를 신뢰하고 본문을 넓게 수집한다.
#  - Type       : 검색 의도와 호출 예산 배분에만 사용. 최종 라벨이 아니다.
#  - LV2        : 최종 분류. 수집 목표는 target_selection 한 곳에서만 정한다.
#  - OpenAI     : 검색 계획 생성에만 사용. 본문 재분류에 쓰지 않는다.
#  - 저장 조건  : 본문 추출 성공 AND 비중복. rerank·quality·acceptance는 점수와 근거만 남긴다.
# 여기에 전략이 없는 LV2는 기존 collection_intents_by_lv2 경로로 그대로 동작한다.
query_planner:
  enabled: true
  max_seed_items: 20
  # 이번 실행에서 살 검색어 수의 최대치. UI/coordinator는 여기에 Gap 상한을 한 번 더 씌운다.
  max_queries_per_lv2: 68   # type별 query_budget 합까지 허용(1_A 기준)
  expected_stored_per_query: 5      # Gap 기반 호출 수 산정용 보수 수율(1_A 실측은 7+)
  reuse:                            # 계획을 매번 새로 만들지 않는다
    max_age_days: 7                 # 이보다 오래된 계획은 재생성
    min_stored_per_query: 1         # query당 평균 저장이 이 미만이면 성과 저조 → 재생성

default_acceptance:
  require_news_source: false
  require_domestic_direct: true
  # false = 목표 LV2 행위 근거가 본문에 없어도 저장한다(2026-08-21 결정).
  # 근거 어휘 매칭 자체는 계속 돌아 lv2_evidence 컬럼에 기록되므로,
  # 나중에 `WHERE lv2_evidence=''`로 걸러낼 수 있다.
  # 되살리려면 true로 바꾼다 — 그러면 근거 0인 후보는 permissive여도 제외된다.
  require_lv2_evidence: false
  min_body_chars: 200
  min_korea_score: 0.60             # score_korea_context 임계. 한글 비율은 근거로 쓰지 않는다.

source_strategies_by_lv2:

  1_A_Toxic_Language:
    # snippet 기반 사전 필터를 끈다. fetch는 HTTP만 쓰므로 공짜이고, 판정은 본문을 읽는
    # acceptance가 더 정확하다. 이걸 끄면 싼 basic 검색으로도 손해가 없어 크레딧이 절반이 된다.
    permissive_collection: true
    recency_days: 365
    # 뉴스는 1년치 모수가 크다. 검색어를 늘리는 게 공급을 늘리는 가장 확실한 수단이다.
    # 크레딧은 쿼리당 과금이라 여기가 곧 비용이다(advanced 기준 쿼리당 2 credits).
    target_types:                   # query_budget = 검색 호출 예산(저장 목표량 아님)
      cyberbullying_and_harassment: {query_budget: 16}
      cyberstalking: {query_budget: 12}
      defamation: {query_budget: 14}
      profanity_and_insults: {query_budget: 14}
      threats_and_intimidation: {query_budget: 12}
    sources:
      # Tavily는 전체 뉴스를 넓게 발견하고, SerpAPI site:는 핵심 언론사를 우선 보완한다.
      # 언론사 목록은 allowlist가 아니다.
      # topic=news: Tavily가 뉴스 색인만 본다. 법률상담·로펌 SEO를 도메인 차단으로는
      # 못 따라간다(실측 2026-08-20: 후보 33건 중 15건이 로펌·상담·논문, 도메인은 전부 제각각).
      # 커뮤니티 원문은 아래 dcinside가 따로 담당하므로 손해가 없다.
      - id: web_news
        access: direct
        method: web_search
        tavily_topic: news
        # 해외 뉴스 유입은 도메인 화이트리스트가 아니라 검색어로 막는다.
        # 매체를 목록으로 묶으면 지역지·전문지·온라인 매체가 통째로 빠진다.
        # query_planner가 모든 검색어에 한국 한정어를 강제한다(require_korea_marker).
        priority: 1
      - id: news_sites
        access: direct
        method: serpapi_site
        # 정적 추출이 실측 확인된 매체만(조선=JS렌더, 경향=403, 한겨레=미확인이라 제외)
        domains: [newsis.com, news.sbs.co.kr, yna.co.kr, donga.com, mt.co.kr]
        priority: 2
      # 디시 원문은 1_A의 raw expression 정답이지만 위 뉴스 기준을 하나도 못 채운다
      # (제목이 '숲음갤 병신인것도 맞는데'다). 이 소스에만 기준을 완화한다.
      - id: dcinside
        access: direct
        method: board_list
        priority: 3
        # 1_A의 핵심은 '언어 폭력 원문'이다. 뉴스는 사건을 보도할 뿐 표현을 담지 않아
        # profanity_and_insults가 저장 94건 중 3건에 그쳤다(실측 2026-08-20).
        # 갈등·경쟁·손실이 상시로 있는 갤러리를 고른다 — 그런 곳에 욕설·비하가 실제로 쌓인다.
        # 정치·사회 갤러리는 의도적으로 뺐다: 욕설은 많지만 정치 노이즈가 같이 들어온다.
        galleries:
          - {id: dcbest,            name: 실시간베스트}      # 전 갤러리 인기글
          - {id: leagueoflegends6,  name: 리그오브레전드}    # 게임 채팅·유저 비난
          - {id: ib_new2,           name: 인터넷방송}        # 스트리머 비난·시청자 공방
          - {id: baseball_new11,    name: 국내야구}          # 선수·팀 비난
          - {id: stock_new2,        name: 국내주식}          # 손실 후 욕설
          - {id: bitcoins_new1,     name: 비트코인}          # 손실 후 욕설
          - {id: football_new8,     name: 해외축구}          # 선수·팀 비난
        max_pages: 1
        # 디시는 요청을 몰아치면 200 + 빈 본문으로 막는다. 목록 7곳 + 글 수십 개를
        # 이어 fetch하는 경로라 전역 1.0초로는 부족하다(실측: 갤러리 10곳 훑고 전면 차단).
        request_delay: 2.5
        overrides:
          permissive_collection: true      # 게시판 목록은 제목이 짧아 사전 필터가 무의미하다
          lv2_risk_signals: [toxic_language]   # 실제 욕설 어휘로 LV2 근거를 본다
          acceptance:
            require_news_source: false                 # 디시는 뉴스가 아니라 한국 플랫폼 원문이다
            korea_evidence: [korean_platform_context]   # 디시 = 한국 플랫폼 원문
            require_domestic_direct: false
            require_published_at: true                  # 뉴스와 동일하게 날짜 필수
            require_incident_context: false             # 사건 서술이 아니라 표현 자체가 목적
            min_body_chars: 80                          # quality의 community 기준과 맞춘다
            required_context_terms: []
    planner:
      # 채널 배분 비율. 예산과 무관하게 두 채널이 항상 함께 돈다.
      # (예전 primary_then_secondary는 '검색어를 더 살 때만 SerpAPI 확장'이라
      #  기본 예산에서는 Tavily만 나갔다.)
      source_mix: {web_news: 70, news_sites: 30}   # Tavily 웹검색 7 : 뉴스사 site: 검색 3
      query_kinds: [incident, investigation, judgment, followup]
      required_context: [korean_incident, online_or_digital_act, victim_or_investigation]
      forbidden_intents: [overseas_only, general_definition]
    acceptance:
      korea_evidence: [korean_person, korean_organization, korean_location]
      # 한국 관련성은 점수·근거만 남기고 저장 여부를 가르지 않는다. 일단 모으고
      # korea_relevance_score·korea_evidence를 보고 나중에 걸러낸다.
      require_domestic_direct: true
      require_published_at: true      # 날짜는 뉴스·디시 모두 필수(없으면 화면에 '-'로만 남는다)
      require_incident_context: false # 사건 서술 요구 해제
      min_body_chars: 200
      # 수집 후 따로 거르는 작업은 최소만 한다(중복·추출 실패·기간·한국 근거 0).
      # 표본 검수로 덧붙였던 어휘 횟수·제목 제외 규칙은 걷어냈다 — 그건 검색이 잘못
      # 물어온 걸 뒤에서 수습하는 일이고, 크레딧은 이미 그 앞에서 다 나갔다.
      # 정밀도는 검색어와 검색 대상에서 만든다(아래 tavily_topic, planner 지침).

  4_I_Privacy_Infringement:
    # provider가 관련성 순으로 돌려준 결과를 사전 필터로 또 버리지 않는다.
    # 저장 판정은 acceptance gate가, 중복은 canonical URL이 막는다.
    permissive_collection: true
    recency_days: 365
    target_types:
      privacy_violation: {query_budget: 26}   # 목표 30건 = 후보 150건 필요(수율 20%)
    sources:
