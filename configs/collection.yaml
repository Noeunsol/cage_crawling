# 목표량/후보 배수/스케줄링/도메인 분리 설정 (7절).
# 이 파일의 숫자는 전부 조정 가능한 기본값이며 Python 코드에 하드코딩하지 않는다 (2.1절).

defaults:
  target_count: 50          # LV2별 이번 실행 신규 목표 수집량 (같은 LV2의 type들이 나눠 가짐, 나머지는 올림)
  candidate_multiplier: 2.0 # candidate_target = ceil(target_count * candidate_multiplier)
  date_range_years: 1       # 기본 수집 기간(최근 N년)

dates:
  allow_future_end_date: false  # 미래 종료일 허용 여부 (8.1절, 기본은 차단)

  # LV2별 기본 수집 기간(개월 단위). 여기 없는 LV2는 defaults.date_range_years(연 단위)를 그대로 쓴다.
  # Streamlit "1. 수집 설정" 화면에서 LV2 카드별로 실행 시점에 더 조정할 수도 있다.
  date_range_months_by_lv2:
    3_G_Misinformation_and_Disinformation: 6   # 허위정보는 최신성이 중요해 6개월로 단축

candidate_multiplier_options: [1.0, 1.5, 2.0, 3.0]

# provider별 자동 candidate_multiplier (7절 확장, 2026-08-31). use_adaptive_multiplier=True로 실행할
# 때만 쓰인다 — 기본 UI/실행 경로는 defaults.candidate_multiplier(단일값)를 그대로 쓰고 이 블록은
# 무시한다 (src/discovery/adaptive_multiplier.py).
candidate_multiplier_by_provider:
  tavily:
    initial: 2.0
  serpapi:
    initial: 1.3

# 검색어에 연도만 조건부로 허용한다 (7절 확장, 2026-08-31). "최근"/"올해"/"지난달" 같은 상대적
# 표현은 여전히 금지 — src/query/generator.py의 _DATE_EXPRESSION이 계속 걸러낸다.
# 이 블록은 별도 변형 쿼리("원래 검색어 + 연도")를 추가로 만들지 여부만 결정한다
# (src/query/year_injection.py). date_out_of_range 비율이 threshold 이상인 (lv2,type,provider)만 대상.
date_query_policy:
  allow_year: true
  allow_relative_date_terms: false
  year_injection:
    min_candidates: 20
    date_out_of_range_threshold: 0.30

adaptive_multiplier:
  min_samples: 30              # (lv2,type,provider) 표본이 이보다 적으면 initial 고정값을 그대로 씀
  safety_factor: 1.1
  min_value: 1.1
  max_value: 4.0
  survival_rate_floor: 0.25    # 생존율이 이보다 낮아도 배수가 무한정 커지지 않도록 하한을 걺

# 근사중복 탐지 모드 (10.3절 확장, 2026-08-31). shadow: near_duplicate_observations에 유사도만
# 기록하고 discard하지 않음(기본값 — 임계값이 아직 100쌍 라벨링으로 검증 전이라 오탐 위험을
# 피한다). enforce: 실제로 걸러냄 — 라벨링 끝나고 임계값 확정한 뒤에 전환할 것.
near_duplicate_detection:
  mode: shadow

# 쿼리/도메인 선택의 탐색 비율 (7절 확장, 2026-08-31). scoring.py가 점수 내림차순으로 우선순위를
# 매기는데, 100% 점수만 따르면 한 번 낮은 점수가 붙은 쿼리/도메인은 영영 다시 안 뽑혀서 표본을
# 못 갱신한다(starvation) — epsilon 확률로 무작위 탐색을 섞어서 막는다.
query_domain_exploration:
  epsilon: 0.2

# type당 provider별 검색어 생성 개수 기본값.
# "3. 검색어 생성 및 검토" 화면은 target_count/candidate_multiplier/provider_ratio로 필요한
# 후보 수를 역산해서 개수를 제안한다: 콜당 최대 결과 수(providers.yaml)로 나눈 최소 호출 수에
# safety_factor를 곱한다 — 실제 콜당 수확은 중복·필터링 탓에 이론치보다 낮기 때문.
# 그 계산이 안 되는 경우(수집 설정 미확정 등)에는 아래 *_count_per_type을 그대로 쓴다.
# safety_factor 2.5: run-10 실측(2026-08-26) 결과 검색어 6개 중 3개가 0건을 반환했다 —
# 검색어 다양화(prompts/query_generation.yaml)만으로는 부족해 개수 자체도 넉넉히 늘렸다.
query_generation:
  tavily_count_per_type: 3
  serpapi_count_per_type: 3
  safety_factor: 2.5

scheduling:
  strategy: round_robin
  stop_before_new_request_when_target_met: true
  finish_started_requests: true
  save_over_target_results: true

domain_partition:
  enabled: true
  # false: Tavily도 SerpAPI 등록 사이트를 검색하고, 같은 URL은 수집 단계에서 중복 제거한다.
  # true: provider를 도메인 기준으로 완전히 분리한다. (2026-08-26 실측: 4_I/3_G에서 SerpAPI
  # 전담 도메인 accepted 콘텐츠 중 tavily 기여분 0건 확인 — 꺼둬서 얻는 실익이 없어 켬)
  tavily_excludes_serpapi_domains: true
  tavily_excludes_global_blacklist: true

# provider 비율 (7.6절). LV2 성격(뉴스형/커뮤니티형/혼합형)에 따라 사용자가 확정한 표.
# by_lv2에 없는 LV2는 default(5:5)를 쓴다. Streamlit "1. 수집 설정" 화면에서 실행 시점에 개별 조정도 가능.
provider_ratio:
  default:
    tavily: 50
    serpapi: 50
  by_lv2:
    1_A_Toxic_Language: {tavily: 50, serpapi: 50}                        # 혼합형
    1_B_Sexual_Content: {tavily: 70, serpapi: 30}                        # 뉴스형
    1_C_Self_Harm: {tavily: 30, serpapi: 70}                             # 커뮤니티형
    1_D_Child_Exploitation: {tavily: 70, serpapi: 30}                    # 뉴스형
    2_E_Discrimination: {tavily: 30, serpapi: 70}                        # 커뮤니티형
    2_F_Bias_and_Hate: {tavily: 30, serpapi: 70}                         # 커뮤니티형
    3_G_Misinformation_and_Disinformation: {tavily: 50, serpapi: 50}     # 혼합형
    3_H_Prohibited_Advisory: {tavily: 30, serpapi: 70}                   # 커뮤니티형
    4_I_Privacy_Infringement: {tavily: 30, serpapi: 70}                  # 커뮤니티형
    4_J_Public_Sensitive_Info_Leakage: {tavily: 70, serpapi: 30}         # 뉴스형
    4_K_Intellectual_Property_Infringement: {tavily: 70, serpapi: 30}    # 뉴스형
    5_L_Illegal_Activity: {tavily: 30, serpapi: 70}                      # 커뮤니티형
    5_M_Violence_and_Extremism: {tavily: 70, serpapi: 30}                # 뉴스형
    5_N_Encouraging_Unethical_Actions: {tavily: 30, serpapi: 70}         # 커뮤니티형
    6_O_CBRNE: {tavily: 70, serpapi: 30}                                 # 뉴스형
    6_P_Cybersecurity: {tavily: 50, serpapi: 50}                         # 혼합형
    6_Q_Prompt_Attack: {tavily: 30, serpapi: 70}                         # 커뮤니티형
    6_R_System_Leakage: {tavily: 30, serpapi: 70}                        # 커뮤니티형
    6_S_Unbounded_Consumption: {tavily: 30, serpapi: 70}                 # 커뮤니티형
