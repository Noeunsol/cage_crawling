        - 유해화학물질 관리 위반 처분 보도
        - 화학 사고 대응 논란 반응
      explosive:
        - 한국 폭발물 수류탄 불발탄 지뢰 포탄 사고 피해 보도
        - 사제 폭발물 검거 판결
        - 폭발물 위협 신고 사건 반응
      nuclear:
        - 한국 핵물질 원자력 시설 사건 조사 보도
        - 원자력 시설 안전 위반 조사
        - 핵 안보 규제 논란 반응
      radiological:
        - 한국 방사성 물질 누출 사고 보도
        - 방사선원 도난 사고 조사 결과
        - 방사성 폐기물 관리 논란 반응
    include_by_type:
      biological: [생물테러, 고위험병원체, 감염성물질, 탄저균, 보툴리눔, 의심 소포]
      chemical: [유해화학물질, 유독물질, 유독가스, 불소 가스, 브로민, 염소 가스,
                 암모니아, 최루탄, 최루가스]
      explosive: [사제폭발물, 사제 폭탄, 폭발물, 고폭탄, 폭탄, 수류탄, 불발탄,
                  지뢰, 포탄, 탄약]
      nuclear: [핵물질, 핵무기, 농축우라늄, 플루토늄, 핵시설, 핵안보]
      radiological: [방사성물질, 방사선, 방사능, 방사성 요오드, 세슘, 방사선원]
    event_terms: [누출, 유출, 노출, 검출, 도난, 분실, 발견, 설치, 폭발, 화재, 사고,
                  대피, 부상, 사망, 피해, 오염, 위협, 테러, 검거, 적발, 수사, 기소,
                  판결, 방제, 회수, 조사, 대응, 감시, 수입 금지]
    include: [사고, 수사, 검거, 규제, 처분, 조사]
    exclude: [제품 안전 광고, 학술 실험 방법, 위키성 문서, 업무보고, 운영허가,
              안전성평가, 입법예고, 행정예고, 채용 공고, 일반 교육]
    korea_required: true

  6_P_Cybersecurity:
    max_searches: 3
    queries_by_type:
      cyber_attack:
        - 웹 취약점 공격 피해 사고 보도
        - 해킹 침해 사고 대응 분석
        - 디도스 공격 피해 논란 반응
      malware_generation:
        - 악성코드 유포 사건 대응 사례
        - 랜섬웨어 감염 피해 신고 사례
        - 악성 앱 유포 단속 반응
      weapon_usage_development:
        - 무기 제작 개조 관련 범죄 사건 보도
        - 불법 무기 소지 검거 판결
        - 무기 개조 논란 규제 반응
    include_by_type:
      cyber_attack: [해킹 침해 사고, 웹 취약점 공격, 디도스 공격, 사이버 공격]
      malware_generation: [악성코드 유포, 랜섬웨어 감염, 악성 앱 유포]
      weapon_usage_development: [불법 무기 소지, 무기 개조 범죄, 무기 제작 사건]
    include: [침해 사고, 랜섬웨어, 악성코드, 취약점, 대응]
    exclude: [보안 솔루션 광고, 자격증 강의 홍보, 위키성 문서]
    korea_required: true

  6_Q_Prompt_Attack:
    max_searches: 2
    queries:
      - 프롬프트 인젝션 실험 사례 정리
      - LLM 탈옥 우회 시도 논란
      - AI 챗봇 안전장치 우회 사건 보도
    queries_by_type:
      prompt_attack:
        - 프롬프트 인젝션 공격 실험 결과
        - AI 안전장치 우회 시도 커뮤니티 반응
        - 챗봇 탈옥 프롬프트 논란 보도
    include_by_type:
      prompt_attack: [프롬프트 인젝션, 탈옥, jailbreak, 안전장치 우회, 챗봇 우회]
    include: [프롬프트 인젝션, 탈옥, jailbreak, 우회, 실험]
    exclude: [단순 LLM 사용법, 제품 홍보, 위키성 문서]
    korea_required: true

  6_R_System_Leakage:
    max_searches: 2
    queries:
      - 시스템 프롬프트 유출 논란 사례
      - AI 서비스 내부 지침 노출 보도
      - 챗봇 다른 사용자 대화 노출 사고
    queries_by_type:
      system_leakage:
        - LLM 시스템 프롬프트 추출 실험 사례
        - AI 서비스 내부 지침 노출 논란 반응
        - 챗봇 대화 교차 노출 사고 보도
    include_by_type:
      system_leakage: [시스템 프롬프트 유출, 내부 지침 노출, 챗봇 대화 노출, 프롬프트 추출]
    include: [시스템 프롬프트, 유출, 노출, 논란, 사고]
    exclude: [프롬프트 작성 팁, 제품 홍보, 위키성 문서]
    korea_required: true

  6_S_Unbounded_Consumption:
    max_searches: 2
    queries:
      - API 요금 폭탄 사고 후기
      - 무한 루프 호출 장애 사례 분석
      - 클라우드 과금 폭증 사고 대응
    queries_by_type:
      unbounded_consumption:
        - LLM API 과다 호출 요금 사고 사례
        - 자동화 스크립트 폭주 장애 보도
        - 클라우드 비용 폭탄 논란 반응
    include_by_type:
      unbounded_consumption: [API 요금 폭탄, 과금 폭증, 무한 루프, 호출 폭주, 클라우드 비용 폭탄]
    include: [요금 폭탄, 과금 폭증, 무한 루프, 장애, 사고]
    exclude: [요금제 안내, 비용 절감 솔루션 광고, 위키성 문서]
    korea_required: true

# 민감 LV2: 위 queries가 맥락(사건 보도·수사·정책)을 제한하고, 여기서 강제 review + 감점 신호를 준다.
# queries에 제조/조달/유통 어휘가 들어가면 validate_collection_intent가 blocked로 실행을 막는다.
sensitive_overlay: 
  1_D_Child_Exploitation:
    disallowed_intents: [material_sharing, explicit_media, how_to]
    force_review: true
  6_O_CBRNE:
    disallowed_intents: [manufacturing, synthesis, procurement, how_to]
    force_review: true

rerank:                             # fetch 전 필터. rule 먼저 → 애매한 후보만 LLM.
  min_discovery_relevance: 0.65
  min_discovery_relevance_floor: 0.40  # 이보다 낮으면 본문 수집하지 않음
  min_korea_relevance: 0.60
  llm_margin: 0.15                  # rule 점수가 임계±margin일 때만 LLM 호출

limits:                             # 폭주·비용 상한. Streamlit UI가 덮어쓴다.
  max_selected_lv2: 5
  max_fetch_per_lv2: 20
  max_fetch_per_type: 6             # type 여러 개인 LV2에서 한 type 독식 방지. 단일 type LV2엔 미적용
  max_total_fetch: 60
  max_total_llm_classify: 60

acceptance:                         # 2차 후보 저장 기준: 한국성 + 유해성 + taxonomy 대략 적합
  broad_candidate: true
  min_taxonomy_fit_score: 0.45
  min_korea_relevance_score: 0.30
  min_concrete_context_score: 0.20

adjudication:
  openai_verification: false         # false면 Tavily·본문 수집 결과를 미검수 후보로 저장
  allow_opportunistic_accept: true  # predicted != target 여도 predicted가 부족하면 저장

# ─────────────────────────────────────────────────────────────────────────────
# 2차 수집 계약 (source_strategies_by_lv2 경로)
# ─────────────────────────────────────────────────────────────────────────────
# 목표: "한국 직접 관련 + 목표 LV2 관련" 콘텐츠.
#  - Type       : 검색 의도와 호출 예산 배분에만 사용. 최종 라벨이 아니다.
#  - LV2        : 최종 분류이자 저장 목표량 기준(lv2_store_target).
#  - OpenAI     : 검색 계획 생성에만 사용. 본문 재분류에 쓰지 않는다.
#  - 저장 조건  : domestic_direct AND 목표 LV2 evidence AND 본문 품질 AND 비중복.
# 여기에 전략이 없는 LV2는 기존 collection_intents_by_lv2 경로로 그대로 동작한다.
query_planner:
  enabled: true
  max_seed_items: 20
  max_queries_per_lv2: 12
  reuse:                            # 계획을 매번 새로 만들지 않는다
    max_age_days: 7                 # 이보다 오래된 계획은 재생성
    min_stored_per_query: 1         # query당 평균 저장이 이 미만이면 성과 저조 → 재생성

default_acceptance:
  require_domestic_direct: true
  require_lv2_evidence: true
  min_body_chars: 200
  min_korea_score: 0.60             # score_korea_context 임계. 한글 비율은 근거로 쓰지 않는다.

source_strategies_by_lv2:

  1_A_Toxic_Language:
    modes: [board_recent, search_planned]
    recency_days: 90                # 커뮤니티 표현은 최근성이 짧다
    lv2_store_target: 30
    target_types:                   # query_budget = 검색 호출 예산(저장 목표량 아님)
      cyberbullying_and_harassment: {query_budget: 3}
      cyberstalking: {query_budget: 2}
      defamation: {query_budget: 2}
      profanity_and_insults: {query_budget: 3}
      threats_and_intimidation: {query_budget: 2}
    sources:
      - id: dcinside
        access: direct
        method: board_list
        priority: 1
        galleries:
          - {id: dcbest, name: 실시간베스트}
          - {id: leagueoflegends6, name: 리그오브레전드}
        max_pages: 1
      - id: naver_kin
        access: direct
        method: serpapi_site
        domain: kin.naver.com/qna
        priority: 2
      # FM코리아는 robots로 본문 수집이 막혀 있다. 검색 비용만 쓰고 저장은 0건이므로 호출하지 않는다.
      - id: fmkorea
        access: blocked
        method: serpapi_site
        domain: fmkorea.com
        priority: 9
    planner:
      query_kinds: [event, expression, source]
      expand_from: [recent_domestic_incidents, community_slang]
      forbidden_intents: [overseas_only, general_definition]
    acceptance:
      korea_evidence: [korean_person, korean_organization, korean_location, korean_platform_context]

  4_I_Privacy_Infringement:
    modes: [search_planned]
    recency_days: 365
    lv2_store_target: 30
    target_types:
      privacy_violation: {query_budget: 6}
    sources:
      - id: naver_kin
        access: direct
        method: serpapi_site
        domain: kin.naver.com/qna
        priority: 1
      - id: dcinside_search
        access: direct
        method: serpapi_site
        domain: gall.dcinside.com
        priority: 2
      - id: web
        access: direct
        method: web_search
        priority: 3
    planner:
      query_kinds: [event, expression]
      forbidden_intents: [overseas_only, general_definition, doxxing_howto]
    acceptance:
      korea_evidence: [korean_person, korean_organization, korean_location, korean_platform_context]

  6_O_CBRNE:
    modes: [official_seed, search_expand]
    recency_days: 730               # 사건 자체가 드물어 창을 넓게 둔다
    lv2_store_target: 30
    target_types:
      biological: {query_budget: 2}
      chemical: {query_budget: 3}
      explosive: {query_budget: 3}
      nuclear: {query_budget: 2}
      radiological: {query_budget: 2}
    sources:
      # 공식기관 원문은 seed이자 최종 콘텐츠다(store_seed). 이후 후속 보도를 추가 검색한다.
      - {id: fire_agency,    access: direct, method: official_board, domain: nfa.go.kr,   priority: 1, store_seed: true}
      - {id: nuclear_safety, access: direct, method: official_board, domain: nssc.go.kr,  priority: 1, store_seed: true}
      - {id: police,         access: direct, method: official_board, domain: police.go.kr, priority: 2, store_seed: true}
      - {id: kdca,           access: direct, method: official_board, domain: kdca.go.kr,  priority: 2, store_seed: true}
      - {id: web,            access: direct, method: web_search,     priority: 3}
    planner:
      query_kinds: [event, source]
      required_context: [incident, investigation, enforcement, response]
      # LLM에 맡기지 않고 query_planner가 문자열 규칙으로 한 번 더 차단한다.
      forbidden_intents: [manufacturing, synthesis, procurement, optimization, weaponization]
    acceptance:
      korea_evidence: [korean_organization, korean_location]

# ─────────────────────────────────────────────────────────────────────────────
# SerpAPI: 커뮤니티 검색 설계 (provider 호출 코드는 아직 연결 전)
# ─────────────────────────────────────────────────────────────────────────────
# 아래 규칙은 Tavily 실행 설정·검색어와 분리한다. 실제 SerpAPI 도입 시에는
# collection_intents_by_lv2의 type별 검색어를 재사용하고, 여기서는 검색 장소와 방식만 정한다.
#
# SerpAPI query 작성·처리 불변 원칙
# 1) taxonomy LV2가 아니라 taxonomy type별 query를 쓴다.
# 2) provider는 rules_by_lv2의 도메인을 읽어 최종 검색식에 `site:도메인`을 반드시 붙인다.
# 3) 실제 한국 사용자가 검색하거나 게시물 제목에 쓸 법한 상황·행동·피해 표현을 쓴다.
# 4) '문제', '논란' 같은 일반어만 단독 사용하지 않고 대상·행동·맥락을 함께 쓴다.
# 5) SerpAPI title/snippet/date는 URL 후보 rerank 전용 메타이며 ContentRecord 본문으로 저장하지 않는다.
serpapi:
  provider:
    engine: google
    # q는 collection_intents_by_lv2의 type별 query에 필요할 때 site:도메인을 붙여 생성한다.
    gl: kr                          # Google 국가 코드
    hl: ko                          # Google UI/결과 언어
    location: South Korea           # 한국 위치 기반 결과 우선
    google_domain: google.co.kr     # 한국 Google 고정
    num: 10                         # q(또는 q + site:) 호출당 결과 수
    start: 0                        # 페이지네이션 시작 위치 (다음 페이지는 10, 20 ...)
    tbs: qdr:y                      # 기본 최근 1년. 직접 날짜 범위 사용 시 cdr:1,cd_min:MM/DD/YYYY,cd_max:MM/DD/YYYY
    safe: "off"                     # 유해 맥락 수집용. 정책·법적 제약은 별도 rerank/본문 검수에서 처리
    filter: 1                       # Google 중복 결과 제거
    nfpr: 1                         # Google의 검색어 자동 교정 비활성화
    max_domains_per_query: 2        # 한 query에서 호출할 site: 도메인 수 상한
    excluded_domains:      # 검색 단계에서 제외. 실측상 후보로는 잡히나 본문 추출이 안 돼 저장 0건이다.
      - namu.wiki           # 위키성 문서 — 사건 원문이 아니라 요약
      - wikipedia.org
      - huggingface.co      # 모델·데이터셋 카드
      - instagram.com       # 이하 SNS·영상: JS 렌더라 ExtractorRouter가 본문을 못 얻는다
      - twitter.com
      - x.com
      - tiktok.com
      - facebook.com
      - youtube.com

  # mode=primary: SerpAPI 우선 / secondary: Tavily 결과가 부족할 때 보완.
  # site_per_query: type query × site:도메인 분리 호출 / broad_then_site: 일반 검색 후 site:도메인 검색.
  # 각 taxonomy가 어디를 검색하는지 한 블록에서 보이도록 profile을 별도 분리하지 않는다.
  rules_by_lv2:
    1_A_Toxic_Language:
      mode: primary
      query_strategy: site_per_query
      domains: [gall.dcinside.com, fmkorea.com, ruliweb.com]
      keyword_groups_by_type:
        cyberbullying_and_harassment: [[악플, 피해], [사이버불링, 고민]]
        cyberstalking: [[온라인 스토킹, 고민], [계정 추적, 피해]]
        defamation: [[명예훼손, 고소], [허위사실, 유포]]
        profanity_and_insults: [[욕설, 고소], [모욕죄, 고민]]
        threats_and_intimidation: [[협박, 신고], [신상 공개, 협박]]
    1_B_Sexual_Content: {mode: secondary, domains: [kin.naver.com, gall.dcinside.com, fmkorea.com], query_strategy: site_per_query, append_terms: [피해, 신고, 상담]}
    1_C_Self_Harm:
      mode: primary
      query_strategy: site_per_query
      # 한국 개인 상담·고민 원문을 type별로 같은 세 곳에서 찾는다. site:에는 경로도 쓸 수 있다.
      domains_by_type:
        eating_disorder: [kin.naver.com/qna, doctornow.co.kr, instiz.net]
        self_injury: [kin.naver.com/qna, doctornow.co.kr, instiz.net]
        suicide: [kin.naver.com/qna, doctornow.co.kr, instiz.net]
      # 지식인 tag/tagDetail은 질문 본문이 아니라 태그 목록이므로 Google 결과에서 제외한다.
      query_suffixes_by_domain:
        kin.naver.com/qna: [-inurl:tag, -inurl:tagDetail]
