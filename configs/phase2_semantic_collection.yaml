# 2차 semantic targeted discovery 설정 (python -m src.main --mode targeted).
# 핵심: taxonomy.yaml 기준 → 자연어 collection intent → Tavily 후보 발견 → 기존 파이프라인 재검증.
# API 결과(content_hint)는 discovery 메타로만 보관, ContentRecord 본문에는 절대 쓰지 않는다.

target_selection:
  min_accepted_per_lv2: 30          # 균일 기본 목표
  targets_by_lv2:                   # (선택) LV2별 개별 목표 override
    4_I_Privacy_Infringement: 40
    6_Q_Prompt_Attack: 15
  review_weight: 0.0                # 이전 DB의 review는 커버리지에 포함하지 않음
  exclude_sufficient_lv2: true      # deficit≤0 LV2는 수집 안 함

providers:
  primary: tavily                   # v1은 tavily만 (v1.5: exa/serpapi fallback)
  tavily: {max_results_per_query: 10, max_candidates_per_lv2: 80, max_queries_per_lv2: 4}

# 수집 중심: taxonomy 맥락 intent. (preferred_domains는 fallback 힌트일 뿐, site: 검색이 중심 아님)
collection_intents_by_lv2:
  4_I_Privacy_Infringement:
    goal: >
      한국어 커뮤니티·Q&A·법률상담·뉴스에서 특정인의 개인정보, 전화번호, 주소, SNS 계정, 사진,
      위치, 사생활 정보가 동의 없이 공개되거나 추적되어 피해를 호소하거나 고소 가능성을 묻는 콘텐츠를 찾는다.
    include: [피해 호소, 고소 가능성 질문, 커뮤니티 폭로/박제, 개인정보 유출 사건, 신상털이]
    exclude: [개인정보보호법 단순 설명, 기업 보안 솔루션 광고, 개인정보처리방침, 위키성 문서]
    korea_required: true
    preferred_domains: [kin.naver.com, pann.nate.com, lawtalk.co.kr]
  3_H_Prohibited_Advisory:
    goal: >
      한국어 커뮤니티·Q&A에서 자격 없는 단정적 의료·법률·금융 조언(약 처방, 투자 종목 추천,
      셀프소송 지침 등)을 제공하거나 요청하는 콘텐츠를 찾는다.
    include: [약 처방 질문, 종목 추천, 리딩방, 셀프소송, 자가진단]
    exclude: [공식 병원 안내, 자격 있는 전문가의 면책 고지, 단순 뉴스 보도]
    korea_required: true
    preferred_domains: [kin.naver.com, lawtalk.co.kr]
  6_Q_Prompt_Attack:
    goal: >
      LLM 안전장치 우회, 프롬프트 인젝션, 탈옥(jailbreak) 시도를 다루는 한국어 기술 글/커뮤니티 글을 찾는다.
    include: [프롬프트 인젝션, 탈옥, jailbreak, 시스템 프롬프트 우회]
    exclude: [단순 LLM 사용법, 제품 홍보, 위키성 설명]
    korea_required: true

# 민감 LV2는 뉴스·기관·정책·사고 맥락으로만 발견하며 자동 accepted 대신 discard한다.
sensitive_overlay:
  1_D_Child_Exploitation:
    allowed_content_types: [news_case, institution, policy, victim_support]
    disallowed_intents: [material_sharing, explicit_media, how_to]
    force_review: true
  6_O_CBRNE:
    allowed_content_types: [news_case, institution, regulation, accident]
    disallowed_intents: [manufacturing, synthesis, procurement, how_to]
    force_review: true

# (선택) LV2별 source_preference. collection_intents_by_lv2에 없는 LV2의 파생 intent 보강.
source_preference:
  6_P_Cybersecurity: {source_types: [tech, community], domains: [clien.net, velog.io, tistory.com]}

rerank:                             # fetch 전 필터. rule 먼저 → 애매만 LLM.
  enabled: true
  min_discovery_relevance: 0.65
  min_korea_relevance: 0.60
  low_priority_relevance: 0.45
  llm_margin: 0.15                  # rule 점수가 임계±margin일 때만 LLM 호출

# 실행 상한(폭주·비용 사고 방지). Streamlit UI가 조정, stage 함수가 강제.
limits:
  max_selected_lv2: 5
  max_fetch_per_lv2: 20
  max_total_fetch: 60
  max_total_llm_classify: 60

acceptance:                         # 본문 기준 최종. korea_relevance 독립 게이트.
  min_taxonomy_fit_score: 0.50
  min_korea_relevance_score: 0.30
  min_concrete_context_score: 0.30
  require_extracted_body: true
adjudication:
  allow_opportunistic_accept: true  # predicted != target 여도 자체 accepted 등급 + predicted 부족이면 저장
