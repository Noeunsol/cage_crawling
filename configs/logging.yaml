# 표준 logging.config.dictConfig 형식 (16.2절: 요청/응답 원문에 API key 등 개인정보를 남기지 않는다).
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/crawler.log
    maxBytes: 5242880   # 5MB
    backupCount: 3
    encoding: utf-8

root:
  level: INFO
  handlers: [console, file]
