# 2차 semantic targeted discovery 설정 (python -m src.main --mode targeted).
# 수집 전략의 단일 정본. 분류 정본은 configs/taxonomy.yaml.
#
# queries_by_type = taxonomy type별 검색어. type당 3개를 서로 다른 각도로 쓴다:
#   ① 당사자 피해·상담 글  ② 사건·수사·판결 보도  ③ 커뮤니티 논란·반응.
#   한 각도만 쓰면 같은 종류의 문서만 반복 수집된다. 키는 taxonomy.yaml의 type 이름(오타면 경고).
# queries = type에 매이지 않는 LV2 공통 검색어(선택). 라운드로빈보다 먼저 나간다.
# max_searches = 이 LV2의 Tavily 호출 상한. 줄이면 type을 버리는 게 아니라 type별 깊이가 줄어든다
#   (쿼리는 type 라운드로빈 순서로 나가므로 ①이 전부 소진된 뒤 ②가 나간다).
# include_by_type/include/exclude = 쿼리에 들어가지 않는다. type별 우선 신호와 공통 가/감점 신호 전용
#   (Tavily에 부정 연산자가 없어 제외어를 쿼리에 넣으면 오히려 그 문서를 불러온다).
# API 결과(content_hint)는 discovery 메타로만 쓰고 ContentRecord 본문에는 넣지 않는다.

target_selection:
  min_accepted_per_lv2: 30          # LV2별 최소 수집량 목표
  targets_by_lv2:                   # LV2별 override
    4_I_Privacy_Infringement: 40
    6_Q_Prompt_Attack: 15
  review_weight: 0.0                # 이전 DB의 review는 커버리지에 미포함
  exclude_sufficient_lv2: false       # 선택 화면에는 부족 0건 taxonomy도 함께 표시

providers:
  tavily:
    max_results_per_query: 10
    max_searches_per_lv2: 5         # LV2별 max_searches가 없을 때의 기본 상한
    search_depth: basic
    chunks_per_source: 1
    topic: general
    time_range: year
    country: south korea
    include_usage: true
    safe_search: false
    excluded_domains: [namu.wiki, huggingface.co]  # 모든 taxonomy 공통 검색 제외

# Streamlit 2차 수집 선택 preset. 뉴스/커뮤니티는 Tavily 검색 결과에서 기대하는 주 출처 성격이며,
# 실제 도메인을 강제 제한하지는 않는다. 혼합형(2_E, 5_L, 6_R)은 개인 경험·기술 맥락 확보를 위해 community로 둔다.
source_selection_presets:
  news_optimized:
    label: 뉴스 최적 taxonomy
    description: 사건·수사·유출·판결·침해 기사에서 원문 맥락을 확보하기 좋은 taxonomy
    lv2s: [1_B_Sexual_Content, 1_D_Child_Exploitation, 3_G_Misinformation_and_Disinformation,
           4_J_Public_Sensitive_Info_Leakage, 4_K_Intellectual_Property_Infringement,
           5_M_Violence_and_Extremism, 6_O_CBRNE, 6_P_Cybersecurity]
  community_optimized:
    label: 커뮤니티 최적 taxonomy
    description: 개인 경험·상담·표현·기술 토론 맥락이 더 중요한 taxonomy
    lv2s: [1_A_Toxic_Language, 1_C_Self_Harm, 2_E_Discrimination, 2_F_Bias_and_Hate,
           3_H_Prohibited_Advisory, 4_I_Privacy_Infringement, 5_L_Illegal_Activity,
           5_N_Encouraging_Unethical_Actions, 6_Q_Prompt_Attack, 6_R_System_Leakage,
           6_S_Unbounded_Consumption]

# taxonomy.yaml의 19개 LV2 × 66개 type 전부에 수동 쿼리를 둔다.
# LV2가 빠지면 taxonomy 파생 + 경고, type이 빠지면 validate 경고. 강제는 tests/test_targeted.py.
collection_intents_by_lv2:

  1_A_Toxic_Language:
    max_searches: 15
    queries_by_type:
      cyberbullying_and_harassment:
        - 커뮤니티 집단 괴롭힘 조리돌림 피해 호소
        - 사이버불링 가해자 처벌 판결 보도
        - 단톡방 따돌림 저격 논란 반응
      cyberstalking:
        - 온라인 스토킹 반복 연락 신고 상담
        - 사이버 스토킹 처벌 사건 보도
        - SNS 계정 추적 집착 피해 후기
      defamation:
        - 허위사실 유포 명예훼손 고소 상담
        - 온라인 명예훼손 손해배상 판결 보도
        - 커뮤니티 허위 폭로글 논란 반응
      profanity_and_insults:
        - 온라인 모욕 욕설 피해 신고 사례
        - 악성 댓글 모욕죄 기소 보도
        - 방송 채팅 욕설 도배 논란
      threats_and_intimidation:
        - 신상 공개 협박 피해 신고 사례
        - 온라인 협박 메시지 검거 보도
        - 커뮤니티 위협 글 논란 반응
    include_by_type:
      cyberbullying_and_harassment: [사이버불링, 집단 괴롭힘, 조리돌림, 저격, 악플, 댓글 폭격]
      cyberstalking: [사이버 스토킹, 계정 스토킹, 반복 연락, SNS 추적, 온라인 스토킹]
      defamation: [허위사실 유포, 명예훼손, 허위 폭로, 악의적 소문, 비방글]
      profanity_and_insults: [온라인 모욕, 욕설, 모욕죄, 패드립, 인신공격]
      threats_and_intimidation: [협박 메시지, 신상 공개 협박, 위협 글, 보복 협박, 살해 협박]
    include: [저격, 조리돌림, 모욕죄, 명예훼손, 괴롭힘, 신상 공개 협박, 신상 털기, 박제, 패드립, 계정 스토킹, 악의적 소문, 댓글 폭격, 사적제재, 인신공격, 악플]
    exclude: [악플 근절 캠페인 안내, 법령 조문 해설, 위키성 문서, 단순 판례 요약집, 기업 홍보, 제품 광고]
    korea_required: true

  1_B_Sexual_Content:
    max_searches: 12
    queries_by_type:
      explicit_sexual_content:
        - 온라인 노골적 성적 콘텐츠 유통 논란 보도
        - 음란물 게시 처벌 사건 판결
        - 플랫폼 선정성 논란 이용자 반응
      non_consensual_intimate_imagery:
        - 지인능욕 딥페이크 유포 피해 신고
        - 불법촬영물 유포 검거 수사 보도
        - 딥페이크 피해 대응 상담 후기
      sexual_coercion_and_manipulation:
        - 성적 사진 협박 강요 피해 상담
        - 몸캠피싱 협박 사건 검거 보도
        - 온라인 그루밍 성적 강요 논란
      sexual_solicitation_and_prostitution:
        - 온라인 성매매 알선 적발 보도
        - 조건만남 유인 피해 신고 사례
        - 성매매 광고 게시물 단속 논란
    include_by_type:
      explicit_sexual_content: [음란물, 노골적 성적 콘텐츠, 선정성, 성인물 유통]
      non_consensual_intimate_imagery: [불법촬영물, 지인능욕, 딥페이크 유포, 합성물 유포, 리벤지 포르노]
      sexual_coercion_and_manipulation: [성적 협박, 성적 강요, 몸캠피싱, 온라인 그루밍, 성적 사진 요구]
      sexual_solicitation_and_prostitution: [조건만남, 성매매 알선, 성매매 광고, 성매수 유인]
    include: [딥페이크 피해, 합성물 유포, 불법촬영, 신고, 처벌]
    exclude: [성인물 사이트 광고, 제품 홍보, 위키성 문서]
    korea_required: true

  1_C_Self_Harm:
    max_searches: 9
    queries_by_type:
      eating_disorder:
        - 한국 온라인 공간에서 극단적 저체중을 이상으로 내세우고 참여를 부추긴 사례
        - 한국 SNS에서 섭식장애 행동이 일반적인 다이어트처럼 추천되거나 미화된 맥락
        - 국내 커뮤니티에서 위험한 체중 감량을 서로 경쟁하거나 동조하는 상황
      self_injury:
        - 한국 SNS에서 자해를 전시하거나 반응을 통해 미화하는 사례
        - 국내 온라인 공간에서 자해 행동을 서로 동조하거나 정상화하는 맥락
        - 한국 커뮤니티에서 자해 충동을 부추기거나 위험 행동을 권하는 상황
      suicide:
        - 한국 온라인 공간에서 자살을 미화하거나 실행 의도를 강화하는 사례
        - 국내 SNS에서 자살 유발 정보가 확산되어 모방 위험이 나타난 맥락
        - 한국 커뮤니티에서 동반자살을 권유하거나 참여를 모집하는 상황
    include_by_type:
      eating_disorder: [프로아나, 뼈말라, 섭식장애, 먹토, 씹뱉, 극단적 감량, 극단적 단식]
      self_injury: [자해, 자해 인증, 자해 동조, 자해 충동, 자해 게시물, 상처 인증]
      suicide: [자살, 자살 암시글, 자살 유발정보, 자살 미화, 자살 동조, 동반자살, 모방 위험]
    exclude: [자살예방상담전화, 상담센터 이용 안내, 병원 광고, 위키성 문서, 윤리강령, 심의규정, 보도 가이드라인, 언론 보도 규제, 단순 통계, 교육 자료, 캠페인 홍보]
    korea_required: true

  1_D_Child_Exploitation:                # sensitive_overlay: 사건·수사·정책·피해지원 맥락만
    max_searches: 12
    queries_by_type:
      child_endangerment:
        - 아동 위험 노출 학대 사건 수사 보도
        - 아동 방임 신고 대응 사례
        - 아동 안전 정책 발표 논란
      child_trafficking:
        - 아동 인신매매 착취 사건 판결 보도
        - 미성년자 착취 조직 검거 수사
        - 아동 인신매매 피해 지원 정책
      csam_distribution:
        - 아동 성착취물 유통 사건 검거 보도
        - 아동 성착취물 소지 처벌 판결
        - 아동 성착취물 규제 정책 논란
      online_grooming:
        - 온라인 그루밍 범죄 처벌 판결 보도
        - 미성년자 그루밍 신고 대응 사례
        - 그루밍 예방 정책 발표 논란
    include_by_type:
      child_endangerment: [아동 학대, 아동 방임, 아동 위험 노출, 아동 안전]
      child_trafficking: [아동 인신매매, 미성년자 착취, 아동 착취 조직]
      csam_distribution: [아동 성착취물, 미성년자 성착취물, 성착취물 유통]
      online_grooming: [온라인 그루밍, 미성년자 그루밍, 아동 성착취 유인]
    include: [수사, 검거, 판결, 처벌, 피해 지원, 정책]
    exclude: [유포 경로, 접속 방법, 위키성 문서, 광고]
    korea_required: true

  2_E_Discrimination:
    max_searches: 6
    queries:
      - 채용 성차별 부당 탈락 경험 호소
      - 장애인 대출 의료 거부 차별 진정 사례
      - 외국인 임대 거부 차별 신고 상담
    queries_by_type:
      discriminatory_activity:
        - 고용 차별 진정 인권위 결정 보도
        - 서비스 이용 거부 차별 피해 호소
        - 차별 논란 기업 대응 반응
    include_by_type:
      discriminatory_activity: [고용 차별, 채용 성차별, 서비스 이용 거부, 임대 거부, 장애인 차별, 외국인 차별]
    include: [차별, 부당 대우, 진정, 배제, 거부, 피해 호소]
    exclude: [차별금지법 조문 해설, 기업 ESG 홍보, 위키성 문서]
    korea_required: true

  # type 11개로 가장 넓다. LV2 쿼리 하나로 뭉치면 특정 축(주로 성별)으로 결과가 획일화된다.
  2_F_Bias_and_Hate:
    max_searches: 33
    queries_by_type:
      age:
        - 세대 연령 비하 표현 논란
        - 노인 혐오 게시물 논란 보도
        - 젊은 세대 조롱 댓글 반응
      beliefs:
        - 신념 사상 비하 게시물 논란
        - 정치 성향 혐오 표현 논란 보도
        - 특정 이념 조롱 커뮤니티 반응
      color:
        - 피부색 비하 표현 논란
        - 인종 외모 비하 방송 논란 보도
        - 피부색 조롱 댓글 반응
      race_and_ethnicity:
        - 인종 민족 비하 표현 논란
        - 인종차별 발언 처벌 사건 보도
        - 민족 비하 게시물 커뮤니티 반응
      nationality:
        - 외국인 노동자 국적 혐오 댓글 논란
        - 특정 국가 국민 비하 논란 보도
        - 이주민 혐오 게시물 반응
      gender:
        - 여성 남성 혐오 게시물 논란 보도
        - 성별 갈등 조장 게시물 논란
        - 젠더 혐오 표현 규제 반응
      disability:
        - 장애인 비하 표현 논란 보도
        - 장애 비하 발언 사과 사건
        - 장애인 조롱 게시물 반응
      religion:
        - 특정 종교 비하 게시물 논란
        - 종교 혐오 표현 사건 보도
        - 종교 조롱 커뮤니티 반응
      geographic_region:
        - 지역 비하 표현 커뮤니티 논란
        - 지역감정 조장 게시물 논란 보도
        - 특정 지역 조롱 댓글 반응
      occupation:
        - 직업군 비하 표현 논란
        - 특정 직업 조롱 발언 사건 보도
        - 노동 직군 비하 게시물 반응
      sexual_orientation:
        - 성적 지향 혐오 표현 논란
        - 성소수자 혐오 발언 사건 보도
        - 성적 지향 조롱 게시물 반응
    include_by_type:
      age: [노인 혐오, 세대 비하, 연령 비하]
      beliefs: [정치 성향 혐오, 이념 비하, 사상 조롱]
      color: [피부색 비하, 인종 외모 비하]
      race_and_ethnicity: [인종차별, 민족 비하, 인종 혐오]
      nationality: [국적 혐오, 외국인 혐오, 이주민 혐오]
      gender: [여성 혐오, 남성 혐오, 성별 갈등, 젠더 혐오]
      disability: [장애인 비하, 장애 혐오, 장애인 조롱]
      religion: [종교 혐오, 종교 비하, 종교 조롱]
      geographic_region: [지역 비하, 지역감정, 지역 조롱]
      occupation: [직업 비하, 직업군 조롱, 노동자 혐오]
      sexual_orientation: [성소수자 혐오, 성적 지향 혐오, 성적 지향 조롱]
    include: [혐오 표현, 비하, 논란, 고정관념, 조롱]
    exclude: [혐오표현 연구 논문 요약, 캠페인 홍보, 위키성 문서]
    korea_required: true

  3_G_Misinformation_and_Disinformation:
    max_searches: 12
    queries_by_type:
      false_news:
