# AI Safety Risk Taxonomy 원본 데이터 (사용자 제공, 2026-08-24)
# - lv2_definition/lv2_description: 사용자 표 2 (LV2 그룹 단위 정의/설명)
# - types[].definition/description: 사용자 표 1 (type 단위 상세 설명), 현재는 두 필드가 동일한 원문
# - include_criteria/exclude_criteria: 원본 자료에 없어 빈 배열로 시작. Streamlit UI(검색어 검토 화면)에서
#   채워야 taxonomy 적합성 LLM 필터가 의미 있게 동작한다.
# - search_vocabulary/collection_exclude_criteria/harm_positive_exclude_criteria/query_axes(type 단위),
#   lv2_fallback_vocabulary(lv2 단위): 전부 선택 필드. 없는 type/lv2는 기존 동작(exclude_criteria만 사용,
#   축 없이 생성 등)으로 폴백한다 (src/query/vocabulary.py). 있을 땐 config/validator.py가 문자열 리스트인지만
#   검사한다 — 현재는 1_C_Self_Harm에만 채워져 있고 다른 LV2로 확장하려면 여기에 그대로 추가하면 된다.
# - enabled: type 활성/비활성 스위치. 기본은 전체 true, UI에서 LV2 선택 시 하위 type이 이 값으로 토글된다.

taxonomy:
- lv1_name: Toxicity Harms
  lv2_id: 1_A_Toxic_Language
  lv2_name: Toxic_Language
  lv2_definition: 타인을 모욕, 위협, 괴롭히거나 불쾌감을 주는 욕설/비속어 생성 및 특정 개인에 대한 명예훼손, 사이버 불링, 스토킹을 조장하는 행위
  lv2_description: 타인을 괴롭히거나 위협, 모욕, 폄하하는 공격적인 언어 표현
  types:
  - name: cyberbullying_and_harassment
    definition: 온라인·디지털 환경에서 특정 개인을 반복적 또는 집단적으로 조롱, 따돌림, 공개 망신, 괴롭힘의 대상으로 삼는 행위
    description: 온라인·디지털 환경에서 특정 개인을 반복적 또는 집단적으로 조롱, 따돌림, 공개 망신, 괴롭힘의 대상으로 삼는 행위
    include_criteria:
    - 특정인을 대상으로 한 실제 조롱·따돌림·공개망신·괴롭힘 게시물이나 그로 인한 피해·신고 사례
    - 온라인 괴롭힘 사건에 대한 법률 상담이나 처벌·소송 사례
    exclude_criteria:
    - 괴롭힘 예방 캠페인, 상담센터 소개, 교육자료 등 일반 계도성 콘텐츠
    - 괴롭힘과 무관한 온라인 갈등·논쟁 일반론
    enabled: true
    tavily:
      topic: news
  - name: cyberstalking
    definition: 특정인의 온라인 활동, 계정, 위치, 관계 등을 지속적으로 추적하거나 차단 이후에도 반복적으로 접근·연락하는 행위
    description: 특정인의 온라인 활동, 계정, 위치, 관계 등을 지속적으로 추적하거나 차단 이후에도 반복적으로 접근·연락하는 행위
    include_criteria:
    - 특정인의 온라인 활동·위치·관계를 지속적으로 추적하거나 차단 후에도 반복 접근한 실제 사례
    - 스토킹 피해 신고, 처벌, 접근금지 명령 등 법적 대응 사례
    exclude_criteria:
    - 스토킹 예방수칙이나 안전 앱 등을 소개하는 일반 안내 콘텐츠
    - 위치추적 기술 자체를 설명하는 일반 기술 정보
    enabled: true
    tavily:
      topic: news
  - name: defamation
    definition: 허위 또는 확인되지 않은 사실을 퍼뜨려 특정 개인이나 단체의 명예와 사회적 평판을 훼손하는 행위
    description: 허위 또는 확인되지 않은 사실을 퍼뜨려 특정 개인이나 단체의 명예와 사회적 평판을 훼손하는 행위
    include_criteria:
    - 허위·미확인 사실 유포로 특정인·단체의 명예가 실제로 훼손된 사례
    - 명예훼손 고소·소송·처벌 관련 상담 및 판결 사례
    exclude_criteria:
    - 명예훼손죄 요건을 설명하는 일반 법률 지식 콘텐츠
    - 사실로 확인된 정당한 비판·보도 (허위성이 없는 경우)
    enabled: true
    tavily:
      topic: news
  - name: profanity_and_insults
    definition: 특정인을 대상으로 욕설, 비속어, 모욕, 외모 비하, 인신공격, 패드립 등 공격적 표현을 사용하는 행위
    description: 특정인을 대상으로 욕설, 비속어, 모욕, 외모 비하, 인신공격, 패드립 등 공격적 표현을 사용하는 행위
    include_criteria:
    - 특정인을 대상으로 한 실제 욕설·비속어·외모비하·인신공격 게시물이나 발언 사례
    - 모욕죄 고소·처벌 관련 상담 사례
    exclude_criteria:
    - 비속어·욕설 사용에 대한 일반적인 언어 문화 논의나 통계
    - 특정 대상 없이 감탄사로 쓰이는 비속어 사용
    enabled: true
    tavily:
      topic: general
  - name: threats_and_intimidation
    definition: 신체적 위해, 정보 유포, 보복 등을 암시하거나 경고하여 상대방에게 공포를 주고 행동을 강요하는 행위
    description: 신체적 위해, 정보 유포, 보복 등을 암시하거나 경고하여 상대방에게 공포를 주고 행동을 강요하는 행위
    include_criteria:
    - 신체적 위해·정보유포·보복 등을 암시해 실제로 공포를 유발한 협박 사례
    - 협박죄 고소, 처벌, 신변보호 요청 등 법적 대응 사례
    exclude_criteria:
    - 협박 대응 요령이나 신고 절차를 안내하는 일반 계도 콘텐츠
    - 위협 의도 없이 관용적으로 쓰이는 표현 (스포츠·게임 응원 문구 등)
    enabled: true
    tavily:
      topic: news
- lv1_name: Toxicity Harms
  lv2_id: 1_B_Sexual_Content
  lv2_name: Sexual_Content
  lv2_definition: 노골적인 성적 묘사, 외설적 콘텐츠 생성 및 실존 인물의 비동의 성적 이미지(NCII, 지인능욕 딥페이크) 생성을 돕거나 성매매를 알선하는 행위
  lv2_description: 노골적인 성적 묘사, 성행위 묘사 등의 유해 콘텐츠
  types:
  - name: explicit_sexual_content
    definition: 성행위, 성기, 성적 자극 또는 신체 노출을 노골적이고 구체적으로 묘사하거나 생성하는 행위
    description: 성행위, 성기, 성적 자극 또는 신체 노출을 노골적이고 구체적으로 묘사하거나 생성하는 행위
    include_criteria:
    - 성행위·성기·신체노출을 노골적으로 묘사한 실제 게시물이나 그로 인한 신고·삭제 사례
    - 음란물 유포죄 등 관련 법률 상담·처벌 사례
    exclude_criteria:
    - 성교육이나 의학적 설명 등 노골적 묘사 없는 일반 정보
    - 성인용품·콘텐츠 플랫폼 광고
    enabled: true
    tavily:
      topic: general
  - name: non_consensual_intimate_imagery
    definition: 당사자의 동의 없이 나체, 성적 이미지, 불법촬영물, 성적 딥페이크 등을 생성·촬영·유포하는 행위
    description: 당사자의 동의 없이 나체, 성적 이미지, 불법촬영물, 성적 딥페이크 등을 생성·촬영·유포하는 행위
    include_criteria:
    - 동의 없이 촬영·유포된 나체·성적 이미지, 불법촬영물, 딥페이크 피해 사례
    - 관련 고소·처벌·삭제지원 등 법적 대응 사례
    exclude_criteria:
    - 디지털 성범죄 예방 교육이나 신고센터 안내 등 일반 계도 콘텐츠
    - 피해 지원 서비스 자체를 소개하는 홍보성 글
    enabled: true
    tavily:
      topic: news
  - name: sexual_coercion_and_manipulation
    definition: 협박, 권력관계, 심리적 압박, 기만 등을 이용해 상대방에게 성적 행위나 성적 이미지 제공을 강요하는 행위
    description: 협박, 권력관계, 심리적 압박, 기만 등을 이용해 상대방에게 성적 행위나 성적 이미지 제공을 강요하는 행위
    include_criteria:
    - 협박·권력관계·기만을 이용해 성적 행위나 이미지를 강요한 실제 사례
    - 관련 고소, 처벌, 피해 상담 사례
    exclude_criteria:
    - 강요 정황이 없는 일반적인 연애·관계 상담
    - 그루밍·강요 개념을 설명하는 학술 콘텐츠
    enabled: true
    tavily:
      topic: news
  - name: sexual_solicitation_and_prostitution
    definition: 성매매, 대가성 성행위, 성적 만남을 제안·알선·중개하거나 참여자를 모집하는 행위
    description: 성매매, 대가성 성행위, 성적 만남을 제안·알선·중개하거나 참여자를 모집하는 행위
    include_criteria:
    - 성매매·대가성 성행위를 실제로 제안·알선·중개하거나 참여자를 모집한 사례
    - 성매매 단속, 처벌, 고소 관련 사례
    exclude_criteria:
    - 성매매 처벌법 자체를 설명하는 일반 법률 정보
    - 성매매와 무관한 일반 데이트·만남 주선 서비스
    enabled: true
    tavily:
      topic: news
- lv1_name: Toxicity Harms
  lv2_id: 1_C_Self_Harm
  lv2_name: Self_Harm
  lv2_definition: 자살, 자해, 섭식 장애의 구체적인 방법을 안내하거나 미화하며, 위험한 행위의 참여를 독려하는 행위
  lv2_description: 자살 및 자해 방법을 제공하거나 섭식 장애 등을 조장하는 콘텐츠
  # 정적/최신/definition 폴백이 전부 비었을 때만 쓰는 최후 폴백 (vocabulary.build_vocabulary).
  # 구체적인 방법·도구·신체 부위·치명성 정보는 넣지 않는다 — 신고/규제/정책 관련 일반 표현만.
  lv2_fallback_vocabulary:
  - 유해 콘텐츠 신고
  - 온라인 커뮤니티 논란
  - 콘텐츠 규제 조치
  - 청소년 보호 정책
  - 플랫폼 정책 위반
  types:
  - name: eating_disorder
    definition: 극단적 절식, 폭식·구토, 위험한 체중 감량 등 섭식 장애 행동을 조장하거나 구체적인 방법을 제공하는 행위
    description: 극단적 절식, 폭식·구토, 위험한 체중 감량 등 섭식 장애 행동을 조장하거나 구체적인 방법을 제공하는 행위
    include_criteria:
    - 극단적 절식·폭식구토·위험한 체중감량 등 구체적 방법을 공유하거나 조장하는 실제 게시물·커뮤니티 글
    - 섭식장애 조장 콘텐츠로 인한 논란이나 규제 관련 보도
    # exclude_criteria는 하위 호환용으로 유지 — 실제로는 collection_exclude_criteria가 우선 적용된다
    # (vocabulary.effective_exclude_criteria).
    exclude_criteria:
    - 섭식장애 치료·상담·예방을 다루는 의료·계도 콘텐츠
    - 위험한 방법 조장이 없는 일반 다이어트·건강식 정보
    # 수집(검색어 생성·taxonomy 적합성 판단) 단계에서만 쓴다 — 한국 사건·은어·플랫폼 문화·정책 맥락이
    # 있으면 예방/치료/규제 기사라도 이 기준으로는 걸러내지 않는다.
    collection_exclude_criteria:
    - taxonomy와 무관한 일반 건강·다이어트 정보
    - 단순 상품·서비스 광고
    - 관련 맥락이 없는 통계 기사
    - 본문 없이 상담기관 연락처만 제공하는 안내
    - 구체적인 사건·표현·논란이 없는 일반 캠페인
    # 아직 어떤 코드도 참조하지 않는다 — 추후 별도의 유해 positive 판정 단계가 생기면 그때 쓴다.
    # self_injury/suicide와 기준이 동일해서 YAML 앵커로 공유한다.
    harm_positive_exclude_criteria: &self_harm_harm_positive_exclude
    - 치료와 회복을 권장하는 콘텐츠
    - 예방 캠페인과 생명존중 교육
    - 상담센터와 신고 방법 안내
    - 위험 행동을 조장하지 않는 일반 보도
    - 구체적인 방법이나 권유가 없는 사회현상·통계 콘텐츠
    search_vocabulary:
    - 섭식장애 조장
    - 프로아나
    - 뼈말라
    - 거식 조장
    - 극단적 다이어트
    - 섭식장애 커뮤니티
    - 체중 감량 강박
    - 섭식장애 유해 콘텐츠
    - 다이어트 인증
    - 섭식장애 논란
    query_axes:
    - 조장·미화 콘텐츠
    - 커뮤니티 은어·문화
    - 청소년 모방 논란
    - 플랫폼 규제·삭제
    - 피해·회복 경험에서 언급된 유해 콘텐츠
    enabled: true
    tavily:
      topic: news
  - name: self_injury
    definition: 자해의 구체적인 방법, 도구, 부위, 은폐법 등을 안내하거나 자해를 미화·독려하는 행위
    description: 자해의 구체적인 방법, 도구, 부위, 은폐법 등을 안내하거나 자해를 미화·독려하는 행위
    include_criteria:
    - 자해 방법·도구·부위·은폐법을 구체적으로 안내하거나 미화하는 실제 게시물
    - 자해 관련 상담 요청 게시물이나 그에 대한 위험한 응답 사례
    exclude_criteria:
    - 자해 예방 캠페인, 상담센터 안내, 정신건강 교육 콘텐츠
    - 방법 조장이 없는 자해 흉터 치료 등 의료 정보
    collection_exclude_criteria: &self_harm_collection_exclude
    - taxonomy와 무관한 일반 건강 정보
    - 단순 상품·서비스 광고
    - 관련 맥락이 없는 통계 기사
    - 본문 없이 상담기관 연락처만 제공하는 안내
    - 구체적인 사건·표현·논란이 없는 일반 캠페인
    harm_positive_exclude_criteria: *self_harm_harm_positive_exclude
    search_vocabulary:
    - 자해 조장
    - 자해 인증
    - 자해 게시물
