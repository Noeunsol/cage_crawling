# provider별 검색어 생성 프롬프트 (2.2절 표준 구조).
# system_prompt/user_prompt는 required_inputs 값으로 채워진 뒤 OpenAI(gpt-4o-mini)에 그대로 전달된다.
name: query_generation
version: 1

required_inputs:
  - taxonomy_lv2
  - type_name
  - definition
  - include_criteria    # 렌더링 시 줄바꿈으로 구분된 불릿 텍스트로 미리 가공해서 넘긴다
  - exclude_criteria
  - provider             # "tavily" 또는 "serpapi"
  - query_count

condition:
  language: ko
  exclude_date_expressions: true   # "2026년", "최근 1년" 같은 기간 표현 금지 (5.1절)
  forbid_site_operator: true       # site: 결합은 이후 discovery 단계 코드가 담당 (5.1, 5.3절)

system_prompt: |-
  당신은 한국어 웹 콘텐츠 수집을 위한 검색어를 만드는 어시스턴트입니다.
  주어진 AI Safety Risk Taxonomy의 LV2/type 정의를 바탕으로, 실제 한국 사건·사례·게시물을 찾을 수 있는
  검색어를 provider 특성에 맞게 생성합니다.

  provider가 "tavily"인 경우:
  - 자연어 문장 또는 사건 맥락이 드러나는 구(句) 형태로 작성합니다.
  - 뉴스 기사, 실제 사례, 커뮤니티 게시글을 폭넓게 찾을 수 있는 표현을 사용합니다.

  provider가 "serpapi"인 경우:
  - 짧은 키워드 조합으로 작성합니다 (2~5개 단어).
  - 커뮤니티·플랫폼에서 실제로 쓰이는 은어, 게시판 용어, 검색 관용구를 우선합니다.
  - 도메인이나 site: 연산자는 절대 포함하지 않습니다. 도메인 결합은 별도 시스템이 처리합니다.

  공통 규칙:
  - 모든 검색어는 한국어로 작성합니다.
  - "2026년", "최근 1년", "올해", "지난달"처럼 특정 기간을 가리키는 표현은 절대 넣지 않습니다.
    기간 제한은 검색 API의 날짜 필터가 별도로 처리합니다.
  - taxonomy label 문자열(type 이름 자체)만 그대로 검색어로 쓰지 않습니다. definition/include_criteria를
    참고해 실제 사람들이 쓸 법한 표현으로 구체화합니다.
  - exclude_criteria에 해당하는 내용을 유도하는 검색어는 만들지 않습니다.

user_prompt: |-
  [Taxonomy 정보]
  LV2: {taxonomy_lv2}
  type: {type_name}
  definition: {definition}

  포함 기준:
  {include_criteria}

  제외 기준:
  {exclude_criteria}

  [요청]
  provider: {provider}
  이 provider에 맞는 검색어를 정확히 {query_count}개 생성해주세요.

output_schema:
  type: object
  properties:
    queries:
      type: array
      items:
        type: string
      minItems: 1
  required: [queries]
  additionalProperties: false
