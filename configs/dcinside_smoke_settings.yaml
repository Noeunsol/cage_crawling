quality:
  min_body_chars: 50
  min_korean_ratio: 0.1
  min_quality_score: 0.0

matching:
  auto_save_threshold: 0.0
  review_threshold: 0.0
  llm: {enabled: false}

extraction:
  min_extract_chars: 50
  success_criteria:
    community: {min_body_chars: 50, require_title: true}
  comments: {max_comments: 50, max_comment_chars: 500}
  playwright: {enabled: false}
  firecrawl: {enabled: false}

http:
  timeout: 20
  per_domain_delay: 2.0
  respect_robots: true
  user_agent: "Mozilla/5.0 (compatible; taxonomy-research-crawler/0.1; +contact@example.com)"

run_limits:
  max_urls_per_query: 5
  max_extracts_per_run: 5

budget:
  global_max_queries: 0
  global_max_extracts: 5

privacy:
  enabled: true
  masking_version: v1_regex_basic
  save_raw_text: true
  export_raw_text: false
  default_export_text_field: masked_text

export:
  include_raw: false
