# 2차 semantic targeted discovery 설정 (python -m src.main --mode targeted).
# 수집 전략의 단일 정본. 분류 정본은 configs/taxonomy.yaml.
#
# queries_by_type = taxonomy type별 검색어. type당 3개를 서로 다른 각도로 쓴다:
#   ① 당사자 피해·상담 글  ② 사건·수사·판결 보도  ③ 커뮤니티 논란·반응.
#   한 각도만 쓰면 같은 종류의 문서만 반복 수집된다. 키는 taxonomy.yaml의 type 이름(오타면 경고).
# queries = type에 매이지 않는 LV2 공통 검색어(선택). 라운드로빈보다 먼저 나간다.
# max_searches = 이 LV2의 Tavily 호출 상한. 규칙: **type 수 × 2**(단일 type LV2는 3).
#   쿼리는 type 라운드로빈 순서로 나가므로 ①이 전부 소진된 뒤 ②가 나간다. type 수와 같게 두면
#   ①피해·상담 각도만 돌고 ②사건·보도는 한 번도 안 나간다. tests/test_targeted.py가 이 규칙을 강제한다.
# 단일 type LV2에는 LV2 공통 `queries`를 두지 않는다 — 공통이 라운드로빈보다 먼저 나가
#   type 쿼리를 통째로 밀어냈던 이력이 있고, type이 하나면 구분 자체가 무의미하다.
# include_by_type/include/exclude = 쿼리에 들어가지 않는다. type별 우선 신호와 공통 가/감점 신호 전용
#   (Tavily에 부정 연산자가 없어 제외어를 쿼리에 넣으면 오히려 그 문서를 불러온다).
# API 결과(content_hint)는 discovery 메타로만 쓰고 ContentRecord 본문에는 넣지 않는다.

# 수집 목표의 단일 정본. 예전엔 같은 숫자가 lv2_store_target·target_count에 흩어져 어긋났다.
# 목표는 화면 랭킹과 UI/coordinator의 Gap 기반 검색 호출 절감에 쓴다.
# 실행량을 묶는 손잡이는 limits.max_total_fetch와 query_planner.max_queries_per_lv2 둘뿐이다.
target_selection:
  min_accepted_per_lv2: 100         # 모든 LV2 공통 누적 목표
  review_weight: 0.0                # 이전 DB의 review는 커버리지에 미포함
  exclude_sufficient_lv2: false     # 선택 화면에는 부족 0건 taxonomy도 함께 표시

# ── Tavily: 현재 실행 중인 2차 뉴스·웹 검색 provider ─────────────────────────
providers:
  tavily:
    # 실측(2026-08-19): 20을 요청하면 16~19건이 오고 중복률은 16%→13%로 오히려 낮아진다.
    # 1_A 검색어 10개 기준 고유 후보 84건 → 166건. 크레딧은 결과 수와 무관하게 쿼리당 과금이다.
    max_results_per_query: 20
    max_searches_per_lv2: 5         # LV2별 max_searches가 없을 때의 기본 상한
    # basic. permissive_collection을 켠 LV2는 snippet으로 fetch 여부를 정하지 않고
    # 본문 전체를 읽는 acceptance gate가 판정하므로, 비싼 snippet을 살 이유가 없다.
    # 실측(2026-08-19): basic 12.0 URL/credit(snippet 중앙값 103자) vs advanced 8.2 URL/credit(1,533자).
    # 같은 크레딧으로 basic이 URL을 1.5배 준다.
    # ⚠️ permissive_collection: false인 LV2(사전 필터가 snippet을 읽는 경우)는 advanced가 유리하다.
    search_depth: basic
    chunks_per_source: 1
    topic: general
    time_range: year
    country: south korea
    include_usage: true
    safe_search: false
    korean_news_domains: [newsis.com, news.sbs.co.kr, yna.co.kr, donga.com, mt.co.kr]
    excluded_domains:      # 검색 단계에서 제외. 실측상 후보로는 잡히나 본문 추출이 안 돼 저장 0건이다.
      - namu.wiki           # 위키성 문서 — 사건 원문이 아니라 요약
      - wikipedia.org
      - huggingface.co      # 모델·데이터셋 카드
      - github.com           # 소스코드 저장소 — 한국 사건 콘텐츠 수집원이 아님
      - gist.github.com
      - raw.githubusercontent.com
      - fmkorea.com          # robots: User-agent:* → Disallow:/
      - pann.nate.com        # robots: User-agent:* → Disallow:/
      - velog.io             # SPA — 정적 HTML에 본문 없음
      - blog.naver.com       # iframe 구조 — 정적 extractor로 본문 수집 불가
      - me.go.kr             # mcee.go.kr로 개편된 리디렉트 셸
      - chosun.com           # SPA — 정적 HTML에 기사 본문 없음
      - khan.co.kr           # 현재 crawler UA에 HTTP 403
      - instagram.com       # 이하 SNS·영상: JS 렌더라 ExtractorRouter가 본문을 못 얻는다
      - twitter.com
      - x.com
      - tiktok.com
      - facebook.com
      - youtube.com

# LV2별 '주(主) provider' 배정. 배타 분할이며 19개 LV2를 모두 덮는다(Streamlit 출처 추천도 이 값을 읽는다).
#
# 배타인 것은 '주 provider'뿐이고, 두 provider는 서로를 대체하지 않는다.
#   Tavily   = 자연어 의미검색. 사건·수사·판결·정책 보도와 블로그 원문에 강하다.
#   SerpAPI  = site: 커뮤니티 정밀검색. 개인 경험·상담·커뮤니티 표현에 강하다.
# 그래서 collection_intents_by_lv2(Tavily)와 serpapi.rules_by_lv2(SerpAPI) 양쪽 모두
# 19개 LV2를 전부 갖고 있다. 주 provider가 기본 예산을 가져가고, 다른 쪽은 같은 LV2를
# 다른 각도로 보강한다 — 예: 4_K는 Tavily가 판결·단속 기사를, SerpAPI가 creator_community의
# 불법유통 제보글을 가져온다. 둘 중 하나가 죽은 설정이 되지 않도록 이 구조를 유지한다.
collection_provider_routing:
  news_tavily:
    provider: tavily
    label: 뉴스 최적 taxonomy
    description: 사건·수사·유출·판결·침해 기사에서 원문 맥락을 확보하기 좋은 taxonomy
    lv2s: [1_A_Toxic_Language, 1_B_Sexual_Content, 1_D_Child_Exploitation, 3_G_Misinformation_and_Disinformation,
           4_J_Public_Sensitive_Info_Leakage, 4_K_Intellectual_Property_Infringement,
           5_M_Violence_and_Extremism, 6_O_CBRNE, 6_P_Cybersecurity]
  community_serpapi:
    provider: serpapi_google
    label: 커뮤니티 최적 taxonomy
    description: 개인 경험·상담·표현·기술 토론 맥락이 더 중요한 taxonomy
    lv2s: [1_C_Self_Harm, 2_E_Discrimination, 2_F_Bias_and_Hate,
           3_H_Prohibited_Advisory, 4_I_Privacy_Infringement, 5_L_Illegal_Activity,
           5_N_Encouraging_Unethical_Actions, 6_Q_Prompt_Attack, 6_R_System_Leakage,
           6_S_Unbounded_Consumption]

# ── Taxonomy-first 2차 수집 계획 ─────────────────────────────────────────────
# UI와 coordinator는 provider가 아니라 taxonomy의 부족분을 먼저 본다.
# type 목표는 LV2 목표(target_selection.min_accepted_per_lv2)를 type 수로 균등 배분한다.
# 여기에는 provider 실행 순서만 둔다 — 목표 숫자는 target_selection 한 곳에만 적는다.
taxonomy_collection_plan:
  defaults:
    review_weight: 0.5             # accepted=1, review=0.5로 coverage 계산
  plans:
    # CBRNE는 Tavily에서 type별 대표 query를 먼저 실행한다. 목표 미달 type만 SerpAPI가
    # 한국 공식기관·보도 사이트를 site: 검색해 보완하므로 두 provider의 중복 호출을 줄인다.
    6_O_CBRNE:
      provider_order: [tavily, serpapi]
    1_C_Self_Harm:
      provider_order: [serpapi, tavily]
    3_H_Prohibited_Advisory:
      provider_order: [serpapi, tavily]
    4_K_Intellectual_Property_Infringement:
      provider_order: [tavily, serpapi]

# taxonomy.yaml의 19개 LV2 × 66개 type 전부에 수동 쿼리를 둔다.
# LV2가 빠지면 taxonomy 파생 + 경고, type이 빠지면 validate 경고. 강제는 tests/test_targeted.py.
collection_intents_by_lv2:

  1_A_Toxic_Language:
    max_searches: 10
    queries_by_type:
      cyberbullying_and_harassment:
        - 커뮤니티 집단 괴롭힘 조리돌림 피해 호소
        - 사이버불링 가해자 처벌 판결 보도
        - 단톡방 따돌림 저격 논란 반응
      cyberstalking:
        - 온라인 스토킹 반복 연락 피해 신고
        - 사이버 스토킹 처벌 사건 보도
        - SNS 계정 추적 집착 피해 후기
      defamation:
        - 허위사실 유포 명예훼손 피해 신고
        - 온라인 명예훼손 손해배상 판결 보도
        - 커뮤니티 허위 폭로글 논란 반응
      profanity_and_insults:
        - 온라인 모욕 욕설 피해 신고 사례
        - 악성 댓글 모욕죄 기소 보도
        - 방송 채팅 욕설 도배 논란
      threats_and_intimidation:
        - 신상 공개 협박 피해 신고 사례
        - 온라인 협박 메시지 검거 보도
        - 커뮤니티 위협 글 논란 반응
    include_by_type:
      cyberbullying_and_harassment: [사이버불링, 집단 괴롭힘, 조리돌림, 저격, 저격글, 악플, 댓글 폭격,
                                     따돌림, 왕따, 단톡방, 학교폭력, 학폭, 뒷담화, 카톡방 괴롭힘]
      cyberstalking: [스토킹, 사이버 스토킹, 계정 스토킹, 반복 연락, SNS 추적, 온라인 스토킹, 집착, 지속적 괴롭힘]
      defamation: [허위사실 유포, 명예훼손, 허위 폭로, 악의적 소문, 비방글, 폭로, 루머, 박제]
      profanity_and_insults: [온라인 모욕, 욕설, 모욕죄, 패드립, 인신공격]
      threats_and_intimidation: [협박, 위협, 협박 메시지, 신상 공개 협박, 위협 글, 보복 협박, 살해 협박]
    include: [저격, 조리돌림, 모욕죄, 명예훼손, 괴롭힘, 신상 공개 협박, 신상 털기, 박제, 패드립, 계정 스토킹,
             악의적 소문, 댓글 폭격, 사적제재, 인신공격, 악플, 따돌림, 왕따, 단톡방, 학교폭력, 피해 학생]
    exclude: [악플 근절 캠페인 안내, 법령 조문 해설, 위키성 문서, 단순 판례 요약집, 기업 홍보, 제품 광고, 법무법인, 성공사례, 무료상담, 수임료, 상담예약, 사건후기]
    korea_required: true

  1_B_Sexual_Content:
    max_searches: 8
    queries_by_type:
      explicit_sexual_content:
        - 온라인 노골적 성적 콘텐츠 유통 논란 보도
        - 음란물 게시 처벌 사건 판결
        - 플랫폼 선정성 논란 이용자 반응
      non_consensual_intimate_imagery:
        - 지인능욕 딥페이크 유포 피해 신고
        - 불법촬영물 유포 검거 수사 보도
        - 딥페이크 피해 대응 상담 후기
      sexual_coercion_and_manipulation:
        - 성적 사진 협박 강요 피해 상담
        - 몸캠피싱 협박 사건 검거 보도
        - 온라인 그루밍 성적 강요 논란
      sexual_solicitation_and_prostitution:
        - 온라인 성매매 알선 적발 보도
        - 조건만남 유인 피해 신고 사례
        - 성매매 광고 게시물 단속 논란
    include_by_type:
      explicit_sexual_content: [음란물, 노골적 성적 콘텐츠, 선정성, 성인물 유통]
      non_consensual_intimate_imagery: [불법촬영물, 지인능욕, 딥페이크 유포, 합성물 유포, 리벤지 포르노]
      sexual_coercion_and_manipulation: [성적 협박, 성적 강요, 몸캠피싱, 온라인 그루밍, 성적 사진 요구]
      sexual_solicitation_and_prostitution: [조건만남, 성매매 알선, 성매매 광고, 성매수 유인]
    include: [딥페이크 피해, 합성물 유포, 불법촬영, 신고, 처벌]
    exclude: [성인물 사이트 광고, 제품 홍보, 위키성 문서, 법무법인, 성공사례, 무료상담, 수임료, 상담예약, 사건후기]
    korea_required: true

  1_C_Self_Harm:
    max_searches: 6
    queries_by_type:
      eating_disorder:
        - 한국 온라인 공간에서 극단적 저체중을 이상으로 내세우고 참여를 부추긴 사례
        - 한국 SNS에서 섭식장애 행동이 일반적인 다이어트처럼 추천되거나 미화된 맥락
        - 국내 커뮤니티에서 위험한 체중 감량을 서로 경쟁하거나 동조하는 상황
      self_injury:
        - 한국 SNS에서 자해를 전시하거나 반응을 통해 미화하는 사례
        - 국내 온라인 공간에서 자해 행동을 서로 동조하거나 정상화하는 맥락
        - 한국 커뮤니티에서 자해 충동을 부추기거나 위험 행동을 권하는 상황
      suicide:
        - 한국 온라인 공간에서 자살을 미화하거나 실행 의도를 강화하는 사례
        - 국내 SNS에서 자살 유발 정보가 확산되어 모방 위험이 나타난 맥락
        - 한국 커뮤니티에서 동반자살을 권유하거나 참여를 모집하는 상황
    include_by_type:
      eating_disorder: [다이어트약, 거식증, 프로아나, 뼈말라, 섭식장애, 먹토, 씹뱉, 극단적 감량, 극단적 단식]
      self_injury: [자해, 자해 인증, 자해 동조, 자해 충동, 자해 게시물, 상처 인증]
      suicide: [자살, 극단적 선택, 자살 암시글, 자살 유발정보, 자살 미화, 자살 동조, 동반자살, 모방 위험]
    exclude: [자살예방상담전화, 상담센터 이용 안내, 병원 광고, 위키성 문서, 윤리강령, 심의규정, 보도 가이드라인, 언론 보도 규제, 단순 통계, 교육 자료, 캠페인 홍보]
    korea_required: true

  1_D_Child_Exploitation:                # sensitive_overlay: 사건·수사·정책·피해지원 맥락만
    max_searches: 8
    queries_by_type:
      child_endangerment:
        - 한국 아동 위험 노출 학대 사건 수사 보도
        - 국내 아동 방임 신고 대응 사례
        - 국내 아동 안전 정책 발표 논란
      child_trafficking:
        - 한국 아동 인신매매 착취 사건 판결 보도
        - 국내 미성년자 착취 조직 검거 수사
        - 국내 아동 인신매매 피해 지원 정책
      csam_distribution:
        - 한국 아동 성착취물 유통 사건 검거 보도
        - 국내 아동 성착취물 소지 처벌 판결
        - 국내 아동 성착취물 규제 정책 논란
      online_grooming:
        - 한국 온라인 그루밍 범죄 처벌 판결 보도
        - 국내 미성년자 그루밍 신고 대응 사례
        - 국내 그루밍 예방 정책 발표 논란
    include_by_type:
      child_endangerment: [아동 학대, 아동 방임, 아동 위험 노출, 아동 안전]
      child_trafficking: [아동 인신매매, 미성년자 착취, 아동 착취 조직]
