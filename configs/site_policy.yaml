# 도메인 → site_name / site_type / preferred_extractor 매핑.
# site_registry.py 가 로드하여 URL 도메인 판별과 ExtractorRouter 분기에 사용.
# preferred_extractor: site_parser | firecrawl | playwright | browser_use
sites:
  naver_kin:
    domains:
      - kin.naver.com
      - m.kin.naver.com
    site_type: qna
    preferred_extractor: site_parser   # MockNaverKinExtractor

  ilbe:
    domains:
      - ilbe.com
      - www.ilbe.com
    site_type: community
    preferred_extractor: site_parser

  doctornow:
    domains:
      - doctornow.co.kr
    site_type: qna              # 의료 상담 Q&A — success_criteria.qna(본문 200자) 적용
    preferred_extractor: trafilatura

  instiz:
    domains:
      - instiz.net
      - www.instiz.net
    site_type: community
    preferred_extractor: site_parser

  dcinside:
    domains:
      - dcinside.com
      - gall.dcinside.com
    site_type: community
    preferred_extractor: site_parser
    # taxonomy 갤러리 실험군(domestic_baseball·streaming·virtual_lawsuit 등)은 삭제했다.
    # keyword 모드 discover()는 subtype.priority_sites로 진입하는데 taxonomy.yaml에 그 필드가
    # 0건이라 도달 불가였고, 노리던 subtype 이름도 구 스키마(Profanity and Insults)라
    # 현재 taxonomy(profanity_and_insults)와 맞지 않았다. 갤러리 수집은 trend 모드가 담당한다.
    # 아래는 board_list 경로 자체를 살아있게 두는 최소 스모크 항목이다.
    board_discovery:
      enabled: true
      adapter: dcinside
      boards:
        - name: dcbest_smoke
          list_url: https://gall.dcinside.com/board/lists/?id=dcbest
          subtypes: [DCInside Smoke]
          weight: 0.05
          min_prefilter_score: 0.0
          max_candidates: 5
      max_pages: 1
      max_candidates_per_board: 20
      request_delay: 2.0
      exclude_notice: true
  fmkorea:
    domains:
      - fmkorea.com
    site_type: community
    preferred_extractor: playwright

  nate_pann:
    domains:
      - pann.nate.com
    site_type: community
    preferred_extractor: playwright

  humoruniv:
    domains:
      - humoruniv.com
    site_type: community
    preferred_extractor: playwright

  ruliweb:
    domains:
      - ruliweb.com
      - bbs.ruliweb.com
    site_type: community
    preferred_extractor: playwright

  clien:
    domains:
      - clien.net
    site_type: community
    preferred_extractor: playwright

  inven:
    domains:
      - inven.co.kr
    site_type: community
    preferred_extractor: playwright

  velog:
    domains:
      - velog.io
    site_type: blog
    preferred_extractor: firecrawl

  tistory:
    domains:
      - tistory.com
    site_type: blog
    preferred_extractor: firecrawl

  news_generic:
    domains:
      - news.naver.com
    site_type: news
    preferred_extractor: firecrawl

  yonhap_news:
    domains:
      - yna.co.kr
    site_type: news
    preferred_extractor: trafilatura

  newsis:
    domains:
      - newsis.com
    site_type: news
    preferred_extractor: trafilatura

  kdca:
    domains: [kdca.go.kr]
    site_type: government
    preferred_extractor: trafilatura

  police:
    domains: [police.go.kr]
    site_type: government
    preferred_extractor: trafilatura

  national_fire_agency:
    domains: [nfa.go.kr]
    site_type: government
    preferred_extractor: trafilatura

  ministry_of_environment:
    domains: [me.go.kr, nics.me.go.kr]
    site_type: government
    preferred_extractor: trafilatura

  nuclear_safety_security_commission:
    domains: [nssc.go.kr]
    site_type: government
    preferred_extractor: trafilatura

  kisa:
    domains:
      - kisa.or.kr
    site_type: news
    preferred_extractor: trafilatura

  lawtalk:
    domains:
      - lawtalk.co.kr
    site_type: qna
    preferred_extractor: site_parser

  namuwiki:
    domains:
      - namu.wiki
    site_type: reference
    preferred_extractor: trafilatura
    use_for_keyword_expansion: true
