# 본문 추출/정제 설정.

fetch:
  timeout_seconds: 15
  user_agent: "Mozilla/5.0 (compatible; CAGE-KoreaCrawler/1.0)"

cleaning:
  strip_html: true
  collapse_blank_lines: true      # 문단 개행은 유지하되 과도한 빈 줄만 정리
  normalize_whitespace: true
  remove_duplicate_paragraphs: true
  duplicate_paragraph_min_length: 80  # 짧은 제목/목록 항목은 반복되어도 유지
  # 본문 맨 앞에서부터 이 길이 이하인 줄이 연달아 나오면(네비게이션 메뉴 등) 잘라낸다.
  # 실제 기사 문단을 만나는 순간(길이 초과) 멈춘다. 0이면 끔 (2026-08-26: a-ha.io 등에서 실측).
  leading_short_line_max_length: 10
  # 아래 문구가 줄 안에 포함되면 그 지점부터 작성자 소개·저작권·관련기사 영역으로 보고 제거한다.
  # ("- Copyrights ⓒ ..."처럼 문구 앞에 다른 기호가 붙는 사이트가 있어 첫머리 일치가 아니라
  # 줄 전체에서 포함 여부로 본다). "저작권자"/"무단전재" 같은 단어는 저작권 침해 사건을 다루는
  # 기사 본문 한복판에도 정당하게 나올 수 있어서, 실제로는 trailing_search_window 안에서만
  # 적용된다 — 마커가 걸려도 문서 끝 부근이 아니면 무시하고 계속 스캔한다.
  trailing_section_markers:
    - "필자 소개"
    - "필자소개"
    - "기자 소개"
    - "기자소개"
    - "[글_"
    - "[글="
    - "저작권자"
    - "<저작권자"
    - "로톡의 모든 콘텐츠는"   # lawtalk.co.kr 저작권 안내 고정문구 (2026-08-26 실측: 16건 누락 확인)
    - "ⓒ"                    # 한국 뉴스매체 공통 저작권 표기("ⓒ 한경닷컴, 무단전재 및 재배포 금지" 등)
    - "무단전재"               # 위와 같은 문구가 ⓒ 없이 나오는 경우 (2026-08-26 실측: hankyung.com 7/7건 누락)
    - "Copyright"             # 영문 저작권 고지 ("@Copyright OOO. All Right Reserved." 등)
    - "상단의 좋아요"           # "칼럼이 도움이 됐다면 상단의 좋아요 버튼을 눌러주세요" 류 공유 유도 문구
    - "후원은 더 좋은 기사에"    # mediatoday.co.kr 후원 유도 문구 (2026-08-26 실측: 19/19건 누락 확인)
    - "영상편집"               # 방송사 영상 크레딧("(영상편집: 이름)") — 보통 이 크레딧부터 제보/반응버튼 꼬리말이 시작됨
    - "촬영기자"               # 위와 같은 방송사 크레딧 패턴
    - "핫 클릭"                # "오늘의 핫 클릭" 등 실시간 인기기사 위젯 제목 — 불릿 목록이 없어 아래 규칙으로 못 잡음
  # "관련기사"/"제보하기"/반응버튼 같은 위젯은 사이트마다 문구가 달라 일일이 등록하기 어렵다.
  # 대신 화살표·불릿 기호로 시작하는 짧은 줄이 여러 줄 이어지는 공통된 생김새로 잡는다
  # (leading_short_line_*과 대칭되는 규칙 — src/extraction/cleaner.py의 _bullet_run_starts_at).
  trailing_bullet_prefixes: ["▷", "☞", "▲", "▶", "■", "□", "※", "-", "·"]
  trailing_bullet_min_run: 2  # 이 개수 이상 연속되면 위젯으로 보고 그 지점부터 잘라낸다
  # 마커/바이라인/불릿 판정 전부 여기 적용된다 — 이 줄 수 이내(문서 끝 기준)에서 걸린 것만
  # 꼬리말로 인정한다. Q&A 답변 중간의 정상적인 목록이나, 저작권 침해 기사 본문 한복판의
  # "저작권자"/"무단전재" 언급까지 지워버리는 걸 막는 안전장치 (0이면 문서 전체 대상).
  trailing_search_window: 20

# trafilatura(본문 추출 라이브러리) 옵션. 댓글·관련기사 등을 빼고 메인 본문만 가져오게 한다.
trafilatura:
  include_comments: false   # 댓글/답글 제외
  favor_precision: true     # 애매하면 "덜 가져오고 정확하게" 쪽을 택함 (재현율보다 정밀도 우선)

# 한국 관련성 판단. OpenAI 없이 한글 비율로만 본다 (사용자 결정, 2026-08-25).
korea_relevance:
  min_korean_ratio: 0.3   # 제목+본문 중 한글 비율이 이보다 낮으면 low_korea_relevance로 제외

# taxonomy 적합성 판단. 기본은 꺼둔다 — 켜면 광고성/위키형/일반정의/
# taxonomy 부적합 콘텐츠도 걸러지지만 콘텐츠당 OpenAI 호출이 1번 더 생긴다. "4. 실행 및 결과" 화면에서
# 실행 시점에 켜고 끌 수 있다 (사용자 결정, 2026-08-25).
taxonomy_filter:
  enabled: false

# 댓글 단위 유해 신호 분리용 설정 (self_injury처럼 원글은 도움 요청이고 댓글에만 위험한 응답이
# 달리는 경우를 위함). src/extraction/comments.py의 select_comments()가 참조한다.
# 주의: 사이트별 파서가 실제로 댓글을 긁어오는 부분은 아직 구현되지 않았다 — 여기 있는 건
# "댓글 후보 목록이 주어졌을 때 대표 댓글을 어떻게 고를지"에 대한 선택 로직/설정뿐이다.
comment_extraction:
  max_comments: 3
  selection_priority:
    - taxonomy_relevance
    - reaction_count
    - representative_or_author_selected

# source_category별 최소 본문 길이(자수). 이보다 짧으면 extraction_too_short 처리한다.
min_content_length:
  news: 200
  community: 50
  qna: 80
  default: 100
