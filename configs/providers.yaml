# API provider 설정. API key 값 자체는 여기 두지 않고 .env의 환경변수 이름만 참조한다.
openai:
  model: gpt-4o-mini
  query_generation_model: gpt-5.6-luna
  query_generation_input_price_per_1m_usd: 0.20
  query_generation_output_price_per_1m_usd: 1.20
  web_search_price_per_1k_calls_usd: 10.00
  api_key_env: OPENAI_API_KEY
  # 1M 토큰당 USD (model 바꾸면 같이 갱신해야 함 — OpenAI 공식 가격표 참고)
  input_price_per_1m_usd: 0.15
  output_price_per_1m_usd: 0.60

tavily:
  api_key_env: TAVILY_API_KEY
  max_results_per_request: 20
  search_depth: basic
  country: south korea   # 한국 관련 결과로 편향 (Tavily 네이티브 파라미터)
  # Tavily가 돌려주는 관련성 점수(item["score"])가 이 값 미만이면 fetch 자체를 안 한다.
  # 실측(2026-09-08): 결과를 20건까지 다 받다 보니 rank 10번대부터 score가 0.1 아래로 떨어지며
  # 검색어와 전혀 무관한 콘텐츠(예: 사이트맵, 무관한 정치 기사)가 섞여 들어와 fetch/추출/openai
  # 필터 비용만 낭비하고 결국 taxonomy_mismatch로 제외됨 — 공짜로 이미 갖고 있던 신호라 바로 씀.
  # serpapi(organic_results)는 이런 점수를 안 주므로 이 값은 tavily에만 적용된다.
  min_relevance_score: 0.15

query_limits:
  # 검색어 검증 상한(핵심어 수/글자수). generator._filter_queries가 강제한다.
  tavily:
    max_terms: 5
    max_characters: 40
  serpapi:
    max_terms: 5
    max_characters: 45

serpapi:
  api_key_env: SERPAPI_KEY
  # Google이 2025-09-14에 num 파라미터를 사실상 무력화해서 지금은 요청값과 무관하게
  # 결과가 10개로 고정된다. 실제와 맞춰 10으로 낮춤 — Google/SerpAPI가 복구하면 100으로 되돌릴 것.
  max_results_per_request: 10
  max_pages_per_query: 10  # 1페이지가 가득 차고 후보 목표가 부족할 때만 다음 페이지 요청
  no_cache: false
